<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16272A">
<title>Helianthus Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:wght@500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Helianthus Table — styles
   Theme tokens are set on :root by applyTheme(); these are the
   Wartable defaults so the page renders before the theme loads.
   ============================================================ */
:root{
  --bg:#16272A; --panel:#1F3438; --panel-2:#284044; --line:#354C50;
  --ink:#ECE4CF; --muted:#A3B1AA; --accent:#E3A94B; --accent-ink:#1B1A14;
  --fear:#C0503F; --fear-deep:#2B1630; --hope:#8CC0A8; --danger:#D86A5A;
  --font-display:"Marcellus", Georgia, serif;
  --font-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --bg-image:none; --bg-dim:.82;
  --radius:10px; --radius-s:6px;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--bg); color:var(--ink);
  font:17px/1.45 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:var(--bg-image) center/cover no-repeat;
  opacity:calc(1 - var(--bg-dim));
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:400; margin:0; line-height:1.15}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- controls ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:36px; padding:6px 14px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--panel-2); cursor:pointer;
  line-height:1.1; white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default; border-color:var(--line)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.small{min-height:30px; padding:3px 10px; font-size:15px}
.icon-btn{
  width:34px; height:34px; min-height:0; padding:0; border-radius:50%;
  font-size:18px; line-height:1;
}
.stepper{display:inline-flex; align-items:center; gap:4px}
.stepper .val{min-width:3.4em; text-align:center; font-variant-numeric:tabular-nums}
.field{display:flex; flex-direction:column; gap:4px; font-size:15px; color:var(--muted)}
.field > span{color:var(--muted)}
input[type=text],input[type=number],input:not([type]),select,textarea{
  background:color-mix(in srgb, var(--bg) 70%, var(--panel));
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:7px 10px; color:var(--ink); min-width:0;
}
textarea{resize:vertical; min-height:80px; line-height:1.45}
input[type=color]{width:42px; height:34px; padding:2px; border:1px solid var(--line); border-radius:var(--radius-s); background:transparent}
input[type=range]{accent-color:var(--accent)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.small-text{font-size:14px}
.hint{color:var(--muted); font-size:15px; margin:0}

/* switch */
.switch{position:relative; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:15px; color:var(--muted)}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .track{
  width:36px; height:20px; border-radius:20px; background:var(--line);
  position:relative; transition:background .15s; flex:none;
}
.switch .track::after{
  content:""; position:absolute; top:3px; left:3px; width:14px; height:14px;
  border-radius:50%; background:var(--ink); transition:transform .15s;
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px); background:var(--accent-ink)}
.switch input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- toasts & modals ---------- */
#toasts{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none}
.toast{background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--accent); padding:9px 14px; border-radius:var(--radius-s); box-shadow:var(--shadow); font-size:15px}
.modal-back{position:fixed; inset:0; background:rgba(5,8,10,.66); display:grid; place-items:center; z-index:150; padding:16px}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); width:min(520px,100%); max-height:90vh; overflow:auto; padding:22px}
.modal h3{font-size:24px; margin-bottom:10px}
.modal .row.end{margin-top:18px}

/* ============================================================
   FEAR — the one loud element
   ============================================================ */
.fear{display:flex; align-items:center; gap:14px}
.fear-count{font-family:var(--font-display); font-size:30px; line-height:1; min-width:2.2ch; text-align:right; font-variant-numeric:tabular-nums}
.fear-label{font-family:var(--font-display); font-size:18px; color:var(--muted)}
.fear-track{display:flex; flex-wrap:wrap; gap:6px}
.fear-pip{
  --d:22px; width:var(--d); height:var(--d); border-radius:50%; flex:none;
  border:1.5px solid color-mix(in srgb, var(--fear) 45%, var(--line));
  background:color-mix(in srgb, var(--fear) 8%, transparent);
  position:relative; overflow:hidden;
}
.fear-pip.on{
  border-color:var(--fear);
  background:
    conic-gradient(from 40deg, var(--fear-deep), color-mix(in srgb,var(--fear) 55%, var(--fear-deep)) 25%, var(--fear-deep) 50%, color-mix(in srgb,var(--fear) 40%, var(--fear-deep)) 75%, var(--fear-deep));
  box-shadow:0 0 10px color-mix(in srgb, var(--fear) 55%, transparent), inset 0 0 6px rgba(0,0,0,.6);
}
.fear-pip.on::after{content:""; position:absolute; inset:28%; border-radius:50%; background:radial-gradient(circle, #000 0 45%, transparent 70%)}
.fear-pip.img{background-size:cover; background-position:center; border-color:transparent; filter:grayscale(1); opacity:.28}
.fear-pip.img.on{filter:none; opacity:1; box-shadow:0 0 10px color-mix(in srgb, var(--fear) 55%, transparent)}
.fear-pip.img.on::after{display:none}
.fear-pip.pulse{animation:fearIn .7s ease-out}
@keyframes fearIn{0%{transform:scale(.4)} 60%{transform:scale(1.25)} 100%{transform:scale(1)}}
.fear.big .fear-pip{--d:clamp(28px,3.4vw,52px)}
.v-head .fear{flex-wrap:wrap}
.fear.big .fear-count{font-size:clamp(40px,5vw,72px)}
.fear.big .fear-label{font-size:clamp(20px,2vw,30px)}

/* ============================================================
   CLOCKS
   ============================================================ */
.clocks{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 18px}
.clock{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.clock .c-name{font-family:var(--font-display); font-size:19px; line-height:1.2}
.clock .c-meta{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.clock svg{display:block; width:var(--clock-d,120px); height:var(--clock-d,120px); overflow:visible}
.clock.wide{grid-column:1/-1; align-items:stretch; text-align:left}
.clock.wide .c-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.bar-track{display:flex; gap:3px; height:26px}
.bar-cell{flex:1; border-radius:3px; background:var(--panel-2); border:1px solid var(--line)}
.bar-cell.on{background:var(--clock-color,var(--accent)); border-color:var(--clock-color,var(--accent))}
.bar-cell.floor{background:repeating-linear-gradient(135deg, var(--line) 0 4px, transparent 4px 8px); border-color:var(--line)}
.bar-cell.floor.on{background:repeating-linear-gradient(135deg, color-mix(in srgb,var(--clock-color,var(--accent)) 75%, #000) 0 4px, var(--clock-color,var(--accent)) 4px 8px)}
.tug-ends{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-top:4px}
.tug-nums{display:flex; gap:16px; font-size:14px; color:var(--muted)}
.tug-nums b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
.clock-img{width:100%; max-width:260px; aspect-ratio:16/9; object-fit:cover; border-radius:var(--radius-s); border:1px solid var(--line)}

/* ============================================================
   PARTY GROUPS
   ============================================================ */
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.group{
  border:1px solid var(--line); border-radius:var(--radius);
  background:color-mix(in srgb, var(--panel) 88%, transparent); padding:14px 14px 12px;
  display:flex; flex-direction:column; gap:10px; position:relative;
}
.group.spot{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 28px color-mix(in srgb, var(--accent) 22%, transparent)}
.group.mine{background:color-mix(in srgb, var(--panel-2) 90%, transparent)}
.group .g-name{font-family:var(--font-display); font-size:20px}
.group .g-loc{color:var(--muted); font-size:15px}
.group .g-tag{font-size:13px; color:var(--accent)}
.group .g-brief{border-left:2px solid var(--accent); padding:4px 0 4px 10px; font-size:15px; white-space:pre-wrap}
.members{display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-content:flex-start}
.member{display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 3px; border-radius:30px; background:var(--panel-2); border:1px solid var(--line); font-size:15px; user-select:none}
.member.me{border-color:var(--accent)}
.face{
  width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--c,#777); color:#111; font-family:var(--font-display); font-size:15px;
  background-size:cover; background-position:center; border:2px solid var(--c,#777);
}
.hope-pips{display:inline-flex; gap:2px; margin-left:2px}
.hope-pips i{width:7px; height:7px; border-radius:50%; border:1px solid var(--hope); display:block}
.hope-pips i.on{background:var(--hope)}

/* ============================================================
   MAP
   ============================================================ */
.mapbox{position:relative; width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:
  radial-gradient(ellipse at 30% 20%, color-mix(in srgb,var(--panel-2) 70%, transparent), transparent 60%), var(--panel); touch-action:none}
.mapbox img.mapimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none}
.mapgrid{position:absolute; inset:0; pointer-events:none; background-image:
  linear-gradient(to right, color-mix(in srgb,var(--ink) 16%, transparent) 1px, transparent 1px),
  linear-gradient(to bottom, color-mix(in srgb,var(--ink) 16%, transparent) 1px, transparent 1px);}
.tok{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none}
.tok .face{width:var(--ts,38px); height:var(--ts,38px); font-size:calc(var(--ts,38px)*.42); box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tok .lbl{font-size:12px; background:rgba(0,0,0,.6); color:#fff; padding:0 6px; border-radius:8px; white-space:nowrap}
.tok.ghost{opacity:.4}
.mapbox.edit .tok{pointer-events:auto; cursor:grab}
.mapbox.edit .tok:active{cursor:grabbing}
.map-title{font-family:var(--font-display); font-size:20px; margin-bottom:8px}

/* ============================================================
   VIEWER (player + table)
   ============================================================ */
.viewer{min-height:100%; display:flex; flex-direction:column}
.v-head{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 16px}
.v-head .v-title{display:flex; align-items:center; gap:10px; justify-content:space-between}
.v-title h1{font-size:22px}
.v-title .sub{color:var(--muted); font-size:14px}
.v-banner{max-height:64px; max-width:70%; object-fit:contain}
.v-head .fear{margin-top:8px}
.status{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap}
.status i{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.status.live i{background:var(--hope)}
.status.wait i{background:var(--accent); animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.v-body{flex:1; padding:18px 16px 96px; max-width:1100px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.v-sec h2{font-size:22px; margin-bottom:12px}
.empty{color:var(--muted); font-size:15px; padding:6px 0}
.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1; background:none; border:0; padding:11px 4px 12px; color:var(--muted); cursor:pointer; position:relative; font-size:15px}
.tabs button[aria-current=page]{color:var(--ink); box-shadow:inset 0 2px 0 var(--accent)}
.tabs .badge{position:absolute; top:6px; margin-left:4px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--fear); color:#fff; font-size:12px; line-height:18px}
.lib{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.lib-item{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column}
.lib-item:hover{border-color:var(--accent)}
.lib-item .thumb{aspect-ratio:4/3; background:var(--panel-2) center/cover; display:grid; place-items:center; color:var(--muted); font-family:var(--font-display); font-size:30px}
.lib-item .t{padding:8px 10px; font-size:15px}
.msg{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--panel)}
.msg.unread{border-color:var(--accent)}
.msg .when{font-size:13px; color:var(--muted); margin-bottom:4px}
.msg .txt{white-space:pre-wrap}
.notes{display:grid; grid-template-columns:200px 1fr; gap:14px; min-height:60vh}
.notes .pages{display:flex; flex-direction:column; gap:6px}
.notes .pages button{text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; cursor:pointer}
.notes .pages button[aria-current=true]{border-color:var(--accent)}
.notes .editor{display:flex; flex-direction:column; gap:8px}
.notes .editor input{font-family:var(--font-display); font-size:20px}
.notes .editor textarea{flex:1; min-height:50vh; font-size:17px}
.save-state{font-size:13px; color:var(--muted)}
@media (max-width:640px){
  .notes{grid-template-columns:1fr}
  .notes .pages{flex-direction:row; overflow-x:auto}
  .notes .pages button{flex:none}
  .v-head .fear{gap:4px 10px}
  .v-head .fear-track{flex-basis:100%; gap:5px}
  .fear-pip{--d:22px}
  .fear-count{font-size:26px}
  .clocks{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .clock svg{--clock-d:104px}
}

/* reveal overlay */
.reveal{position:fixed; inset:0; z-index:120; background:rgba(4,6,8,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:14px; animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0}}
.reveal img{max-width:100%; max-height:76vh; object-fit:contain; border-radius:var(--radius-s); box-shadow:var(--shadow)}
.reveal h2{font-size:28px; text-align:center; color:#f2ecdc}
.reveal .body{max-width:68ch; color:#e9e2cf; white-space:pre-wrap; overflow:auto; max-height:60vh; font-size:18px; line-height:1.55}
.reveal .btn{min-width:120px}

/* join screen */
.join{max-width:460px; margin:8vh auto; padding:24px; display:flex; flex-direction:column; gap:18px}
.join h1{font-size:34px}
.join .code-in{font-family:var(--font-display); font-size:30px; letter-spacing:.18em; text-transform:uppercase; text-align:center; padding:10px}
.pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.pick button{display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left}
.pick button:hover{border-color:var(--accent)}

/* table display */
.table-mode .v-body{max-width:none; padding:24px 32px 32px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:32px; align-items:start}
.table-mode .v-head{position:static}
.table-mode .clock svg{--clock-d:170px}
.table-mode .clock .c-name{font-size:24px}
.table-mode .group .g-name{font-size:26px}
.table-mode .v-sec h2{font-size:28px}
.table-mode .tok .face{width:calc(var(--ts,38px)*1.6); height:calc(var(--ts,38px)*1.6); font-size:calc(var(--ts,38px)*.66)}
.table-mode .tok .lbl{font-size:17px}
@media (max-width:900px){.table-mode .v-body{grid-template-columns:1fr}}

/* ============================================================
   GM CONSOLE
   ============================================================ */
.gm{display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; min-height:100vh}
.gm-top{grid-column:1/-1; display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 94%, transparent); position:sticky; top:0; z-index:40}
.gm-top h1{font-size:20px; white-space:nowrap}
.roomcode{display:flex; align-items:center; gap:8px; padding:4px 6px 4px 12px; border:1px solid var(--line); border-radius:var(--radius-s)}
.roomcode b{font-family:var(--font-display); font-size:22px; letter-spacing:.14em; font-weight:400}
.conns{display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.conns .face{width:26px; height:26px; font-size:12px}
.conns .face.off{opacity:.25; filter:grayscale(1)}
.gm-fear{display:flex; align-items:center; gap:10px; margin-left:auto}
.gm-fear .fear-pip{--d:16px}
.gm-nav{border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:2px; position:sticky; top:59px; align-self:start; height:calc(100vh - 59px); overflow:auto}
.gm-nav .navrow{display:flex; align-items:center; gap:6px; border-radius:var(--radius-s)}
.gm-nav .navrow button.nav{flex:1; text-align:left; background:none; border:0; padding:9px 10px; border-radius:var(--radius-s); cursor:pointer; color:var(--muted)}
.gm-nav .navrow button.nav:hover{color:var(--ink)}
.gm-nav .navrow.cur{background:var(--panel)}
.gm-nav .navrow.cur button.nav{color:var(--ink)}
.gm-nav .sep{height:1px; background:var(--line); margin:10px 6px}
.gm-nav .nav-head{font-size:13px; color:var(--muted); padding:6px 10px 2px}
.gm-main{padding:22px 26px 80px; min-width:0}
body.previewing .gm-main{padding-right:440px}
body.previewing .gm-top{padding-right:18px}
.gm-nav select{width:100%}
.gm-main > h2{font-size:28px; margin-bottom:4px}
.gm-main > .hint{margin-bottom:18px}
.sec-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.sec-head h2{font-size:28px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.stack{display:flex; flex-direction:column; gap:14px}
.ed-clock{display:grid; grid-template-columns:170px minmax(0,1fr); gap:18px; align-items:start}
.ed-clock.wide{grid-template-columns:1fr}
.ed-clock.wide .preview{display:block}
.ed-clock.hidden-from-players{opacity:.72}
.ed-clock .preview{display:flex; justify-content:center}
.ed-clock .ctrls{display:flex; flex-direction:column; gap:10px}
.ed-clock .grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
.ctl-label{font-size:14px; color:var(--muted); margin-right:4px}
.vis-tag{font-size:13px; color:var(--muted)}
.ed-groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.ed-group{border:1px dashed var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--panel)}
.ed-group.drop{border-color:var(--accent); border-style:solid}
.ed-group.spot{border-style:solid; border-color:var(--accent)}
.ed-group .members{min-height:56px; padding:6px; border-radius:var(--radius-s); background:color-mix(in srgb,var(--bg) 60%, var(--panel))}
.ed-group .member{cursor:grab}
.ed-group .member.sel{outline:2px solid var(--accent)}
.map-ed{display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; align-items:start}
.tok-list{display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow:auto}
.tok-row{display:flex; align-items:center; gap:8px; font-size:15px}
.tok-row .face{width:26px; height:26px; font-size:12px}
.ho-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.ho{display:flex; flex-direction:column; gap:8px}
.ho .thumb{aspect-ratio:16/10; border-radius:var(--radius-s); background:var(--panel-2) center/contain no-repeat; border:1px solid var(--line)}
.shareto{display:flex; flex-wrap:wrap; gap:6px}
.chipcheck{display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 4px; border:1px solid var(--line); border-radius:20px; font-size:14px; cursor:pointer}
.chipcheck input{margin:0}
.chipcheck.on{border-color:var(--accent)}
.roster-row{display:grid; grid-template-columns:40px minmax(120px,1fr) 52px auto auto auto; gap:10px; align-items:center}
.roster-row .face{width:36px; height:36px}
.preset-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px}
.preset{border:1px solid var(--line); border-radius:var(--radius); padding:10px; cursor:pointer; background:var(--panel); text-align:left}
.preset.cur{border-color:var(--accent)}
.preset .sw{display:flex; gap:3px; margin-top:6px}
.preset .sw i{flex:1; height:16px; border-radius:3px; display:block}
.img-slot{display:flex; align-items:center; gap:10px}
.img-slot .thumb{width:64px; height:44px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--panel-2) center/cover no-repeat}
.qr{background:#fff; padding:10px; border-radius:var(--radius-s); width:max-content}
.qr svg{display:block; width:160px; height:160px}
.preview-frame{width:390px; max-width:calc(100vw - 64px); height:min(78vh,760px); border:1px solid var(--line); border-radius:22px; overflow:auto; background:var(--bg); position:relative}
.preview-frame .tabs{position:sticky; bottom:0}
@media (max-width:860px){
  .gm{grid-template-columns:1fr}
  .gm-nav{position:static; height:auto; flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line)}
  .gm-nav .sep,.gm-nav .nav-head{display:none}
  .ed-clock{grid-template-columns:1fr}
  .map-ed{grid-template-columns:1fr}
  .gm-main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ---------- adversaries (GM only) ---------- */
.adv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
.adv{display:flex; flex-direction:column; gap:10px}
.adv.defeated{opacity:.5}
.adv.defeated:hover{opacity:.85}
.adv-name{font-family:var(--font-display); font-size:19px}
.adv-down{font-family:var(--font-display); color:var(--danger); font-size:17px}
.adv-track{display:flex; align-items:center; gap:10px}
.adv-track .ctl-label{width:44px}
.pips{display:flex; flex-wrap:wrap; gap:4px}
.pip{width:22px; height:22px; padding:0; border:1.5px solid var(--line); background:transparent; cursor:pointer; border-radius:4px}
.pips.stress .pip{border-radius:50%}
.pips.hp .pip.on{background:var(--danger); border-color:var(--danger)}
.pips.stress .pip.on{background:var(--accent); border-color:var(--accent)}
.pip:hover{border-color:var(--ink)}
details > summary{cursor:pointer; color:var(--muted); font-size:15px}
details[open] > summary{margin-bottom:8px}
.statblock{display:flex; flex-direction:column; gap:7px; font-size:15px; line-height:1.4}
.statblock p{margin:0}
.sb-desc{font-style:italic; color:var(--muted)}
.sb-line{display:flex; flex-wrap:wrap; gap:4px 16px}
.sb-line b{font-weight:500}
.sb-feat{border-top:1px solid var(--line); padding-top:7px}
.sb-text{margin-top:3px}
.adv-lib{display:flex; flex-direction:column; gap:8px}

/* ============================================================
   MESSAGES (players and GM)
   ============================================================ */
.badge{display:inline-block; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--fear); color:#fff; font-size:12px; line-height:18px; text-align:center; font-family:var(--font-body)}
.gm-nav .badge{margin-left:8px}
.btn.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--panel))}
.tag{font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); border:1px solid var(--line); border-radius:10px; padding:1px 6px; margin-left:8px; font-weight:400; white-space:nowrap}
.face.gm-face{--c:var(--accent); color:var(--accent-ink); font-size:12px; letter-spacing:.02em}
.thread-list{display:flex; flex-direction:column; gap:6px}
.thread-item{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:10px 12px; cursor:pointer; color:inherit; font:inherit}
.thread-item:hover{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
.thread-item.cur{border-color:var(--accent)}
.thread-item.unread .ti-title{font-weight:700; color:var(--ink)}
.thread-item .faces{display:flex; flex:none; padding-right:8px}
.thread-item .faces .face{width:30px; height:30px; font-size:12px; margin-right:-8px; box-shadow:0 0 0 2px var(--panel)}
.ti-body{flex:1; min-width:0; display:flex; flex-direction:column; gap:1px}
.ti-title{display:flex; align-items:center; min-width:0}
.ti-snip{color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.ti-side{display:flex; flex-direction:column; align-items:flex-end; gap:4px; flex:none}
.ti-side .when{font-size:12px; color:var(--muted)}
.thread{display:flex; flex-direction:column; gap:8px}
.bubble{max-width:85%; align-self:flex-start; background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 14px 4px; padding:8px 12px}
.bubble.mine{align-self:flex-end; background:color-mix(in srgb, var(--accent) 16%, var(--panel)); border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); border-radius:14px 14px 4px 14px}
.bubble.from-gm{border-color:var(--accent)}
.bubble .who{font-size:13px; font-weight:600; color:var(--accent); margin-bottom:2px}
.bubble .txt{white-space:pre-wrap; overflow-wrap:anywhere}
.bubble .when{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:12px; justify-content:flex-end}
.linkish{background:none; border:0; padding:0; color:var(--muted); cursor:pointer; font:inherit; text-decoration:underline}
.linkish.danger{color:var(--danger)}
.composer{display:flex; flex-direction:column; gap:6px}
.composer textarea{min-height:68px; resize:vertical; font-size:16px}
.to-chips{display:flex; flex-wrap:wrap; gap:6px}
.to-chip{display:inline-flex; align-items:center; gap:7px; min-height:40px; padding:4px 13px 4px 4px; border:1px solid var(--line); border-radius:22px; background:var(--panel); color:inherit; font:inherit; font-size:15px; cursor:pointer}
.to-chip .face{width:30px; height:30px; font-size:12px}
.to-chip.on{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--panel))}
.msg-layout{display:grid; grid-template-columns:minmax(240px,320px) minmax(0,1fr); gap:16px; margin-top:14px; align-items:start}
.thread-pane .thread{max-height:55vh; overflow-y:auto; padding-right:4px}
@media (max-width:900px){ .msg-layout{grid-template-columns:1fr} }
.ti-title{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.ti-tag{font-size:12px; color:var(--accent); letter-spacing:.02em}

/* ============================================================
   SCENARIOS, NODE TRACKERS, WIKI
   ============================================================ */
.scn-pick{display:flex; align-items:center; gap:6px}
.scn-pick select{max-width:200px}
.scn-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius-s)}
.scn-row.cur{border-color:var(--accent)}
.showing{display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--accent); border:1px solid var(--accent); border-radius:20px; padding:1px 2px 1px 10px; white-space:nowrap}
.showing b{max-width:180px; overflow:hidden; text-overflow:ellipsis}

.nodes-clock .nodes{display:flex; flex-wrap:wrap; gap:10px 12px; align-items:flex-start; margin-top:6px}
.node{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:44px}
.node-hit{background:none; border:0; padding:3px; line-height:0; border-radius:10px; color:inherit}
button.node-hit{cursor:pointer}
button.node-hit:hover{background:color-mix(in srgb, var(--ink) 8%, transparent)}
.node-svg{width:44px; height:44px; display:block}
.node-svg *{transition:fill .5s}
.node-name{font-size:13px; color:var(--muted); max-width:72px; text-align:center; overflow-wrap:anywhere}
.node-legend{display:flex; gap:14px; font-size:13px; color:var(--muted); margin-top:8px}
.node-legend span{display:inline-flex; align-items:center; gap:5px}
.node-legend i{width:11px; height:11px; border-radius:50%; display:inline-block}
.node-names{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:4px}
.node-names input{width:78px}
.table-mode .node-svg{width:64px; height:64px}
.table-mode .node-name{font-size:17px}

.eyebrow{font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.reveal .eyebrow{margin-bottom:2px}
.wiki{display:grid; grid-template-columns:minmax(240px,320px) minmax(0,1fr); gap:16px; margin-top:12px; align-items:start}
.wiki-side{display:flex; flex-direction:column; gap:10px; position:sticky; top:74px; max-height:calc(100vh - 96px); overflow:hidden}
.wq{width:100%}
.wcats{display:flex; flex-wrap:wrap; gap:5px}
.wres{display:flex; flex-direction:column; gap:4px; overflow-y:auto; padding-right:4px}
.wres-item{display:flex; flex-direction:column; gap:2px; text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-s); padding:7px 10px; cursor:pointer; color:inherit; font:inherit}
.wres-item:hover{border-color:color-mix(in srgb, var(--accent) 55%, var(--line))}
.wres-item.cur{border-color:var(--accent)}
.wres-t{display:flex; justify-content:space-between; gap:8px; font-weight:600}
.wres-c{font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-weight:400; align-self:center}
.wres-s{font-size:13px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.wiki-main{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; min-height:60vh}
.wentry{display:flex; flex-direction:column; gap:8px; max-width:760px}
.wtitle{font-size:32px; line-height:1.1}
.wimg{max-width:100%; max-height:340px; object-fit:contain; align-self:flex-start; border-radius:var(--radius-s); border:1px solid var(--line)}
.wplayer{border-left:3px solid var(--accent); padding:6px 0 6px 12px; margin:4px 0}
.wplayer p{margin-top:3px; white-space:pre-wrap}
.wbody{display:flex; flex-direction:column; gap:10px; line-height:1.55}
.wbody ul{margin:0; padding-left:20px; display:flex; flex-direction:column; gap:4px}
.wbody .gm-note{background:color-mix(in srgb, var(--fear) 12%, transparent); border-radius:var(--radius-s); padding:8px 10px}
.wbody .gm-note b{color:var(--fear); letter-spacing:.04em}
.wlink{background:none; border:0; padding:0; font:inherit; color:var(--accent); text-decoration:underline; text-underline-offset:2px; cursor:pointer}
.wlink.missing{color:var(--danger); text-decoration-style:dashed}
.wbacks{border-top:1px solid var(--line); padding-top:10px; margin-top:8px; display:flex; flex-direction:column; gap:6px}
.wedit textarea{width:100%}
.wwelcome{display:flex; flex-direction:column; gap:10px; align-items:flex-start; padding:20px 0}
.wcard-prev{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin:10px 0 14px; display:flex; flex-direction:column; gap:6px; background:var(--panel-2)}
.wcard-prev img{max-height:160px; max-width:100%; object-fit:contain; align-self:flex-start}
.wcard-prev p{white-space:pre-wrap}
.wiki-window{padding:18px 22px; max-width:1500px; margin:0 auto}
.wiki-window h1{font-size:30px}
@media (max-width:900px){ .wiki{grid-template-columns:1fr} .wiki-side{position:static; max-height:none} }
.clock .node-svg{width:44px; height:44px}
.ed-clock .preview .node-svg{width:48px; height:48px}
.table-mode .clock .node-svg{width:64px; height:64px}
.nodes-clock{align-items:flex-start; text-align:left}
.wbody p{margin:0}

/* ---------- IndexedDB asset store (images) ---------- */
const AssetStore = {
  mem: new Map(),
  _db: null,
  open() {
    if (this._db) return this._db;
    this._db = new Promise((res, rej) => {
      const r = indexedDB.open('helianthus-table', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('assets', { keyPath: 'id' });
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._db;
  },
  async tx(mode, fn) {
    const db = await this.open();
    return new Promise((res, rej) => {
      const t = db.transaction('assets', mode);
      const st = t.objectStore('assets');
      const out = fn(st);
      t.oncomplete = () => res(out instanceof IDBRequest ? out.result : out);
      t.onerror = () => rej(t.error);
    });
  },
  async put(asset) { this.mem.set(asset.id, asset); try { await this.tx('readwrite', (st) => st.put(asset)); } catch (e) { console.warn('asset put failed', e); } },
  async get(id) {
    if (this.mem.has(id)) return this.mem.get(id);
    try { const a = await this.tx('readonly', (st) => st.get(id)); if (a && a.data) { this.mem.set(id, a); return a; } return null; } catch { return null; }
  },
  async all() { try { const all = await this.tx('readonly', (st) => st.getAll()); for (const a of all || []) this.mem.set(a.id, a); return all || []; } catch { return []; } },
  async del(id) { this.mem.delete(id); try { await this.tx('readwrite', (st) => st.delete(id)); } catch {} },
  async clear() { this.mem.clear(); try { await this.tx('readwrite', (st) => st.clear()); } catch {} },
  url(id) { return id && this.mem.get(id) ? this.mem.get(id).data : null; },
};

/* Downscale an uploaded image so it travels quickly to phones. */
async function ingestImage(file, maxDim = 1800) {
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  let w = img.naturalWidth, hh = img.naturalHeight;
  const scale = Math.min(1, maxDim / Math.max(w, hh));
  let data = dataUrl;
  if (scale < 1 || file.size > 600 * 1024) {
    w = Math.round(w * scale); hh = Math.round(hh * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = hh;
    c.getContext('2d').drawImage(img, 0, 0, w, hh);
    data = c.toDataURL('image/webp', 0.86);
    if (!data.startsWith('data:image/webp')) data = c.toDataURL('image/jpeg', 0.86);
  }
  return { id: 'a' + uid() + uid(), name: file.name, w, h: hh, data };
}

function mergeNotebook(a, b) {

   ============================================================ */

/* Build the full viewer screen from a view object.
   ctx: { mode: 'player'|'table'|'preview', tab, onTab, status, statusText,
          unread, seen, notesPanel(), onOpenHandout(ho), menu } */
function viewerScreen(view, ctx) {
  const mode = ctx.mode;
  const root = h('div', { class: 'viewer' + (mode === 'table' ? ' table-mode' : '') });
  const banner = view.theme && AssetStore.url(view.theme.bannerAsset);
  const status = ctx.status ? h('span', { class: 'status ' + ctx.status }, h('i'), ctx.statusText || '') : null;
  const head = h('header', { class: 'v-head' },
    h('div', { class: 'v-title' },
      h('div', null,
        banner ? h('img', { class: 'v-banner', src: banner, alt: view.title || '' }) : h('h1', null, view.title || 'Helianthus Table'),
        view.subtitle ? h('div', { class: 'sub' }, view.subtitle) : null),
      h('div', { class: 'row', style: { gap: '8px', flexWrap: 'nowrap' } }, status, ctx.menu || null)),
    view.fear ? renderFear(view.fear, view.theme, { big: mode === 'table', pulseFrom: ctx.fearPulseFrom }) : null);
  root.append(head);

  const tabs = [['board', 'Board']];
  if (mode !== 'table') {
    if (view.handouts) tabs.push(['library', 'Library']);
    if (view.messages) tabs.push(['inbox', 'Messages']);
    if (view.notes) tabs.push(['notes', 'Notes']);
  }
  const tab = tabs.some(([k]) => k === ctx.tab) ? ctx.tab : 'board';
  const body = h('main', { class: 'v-body' });
  root.append(body);

  if (tab === 'board') {
    const clocks = view.clocks ? h('section', { class: 'v-sec' }, h('h2', null, 'Clocks'),
      view.clocks.length ? h('div', { class: 'clocks' }, view.clocks.map((c) => renderClock(c))) : h('p', { class: 'empty' }, 'No clocks are running.')) : null;
    const party = view.groups ? h('section', { class: 'v-sec' }, h('h2', null, view.groups.length > 1 ? 'The party, split' : 'The party'),
      renderGroups(view.groups, view.roster, view.me, { hope: view.hope })) : null;
    const map = view.map ? h('section', { class: 'v-sec' }, h('h2', null, view.map.name || 'Map'), renderMap(view.map, view.roster)) : null;
    if (mode === 'table') {
      body.append(h('div', { class: 'stack', style: { gap: '28px' } }, clocks), h('div', { class: 'stack', style: { gap: '28px' } }, party, map));
    } else body.append(...[clocks, party, map].filter(Boolean));
    if (!clocks && !party && !map) body.append(h('p', { class: 'empty' }, 'Nothing is on the board right now.'));
  } else if (tab === 'library') {
    const list = (view.handouts || []).slice().sort((a, b) => b.at - a.at);
    body.append(h('section', { class: 'v-sec' }, h('h2', null, 'Library'),
      list.length ? h('div', { class: 'lib' }, list.map((ho) => {
        const img = AssetStore.url(ho.asset);
        return h('button', { class: 'lib-item', onclick: () => ctx.onOpenHandout && ctx.onOpenHandout(ho) },
          h('span', { class: 'thumb', style: { backgroundImage: img ? `url("${img}")` : null } }, img ? '' : (ho.kind === 'text' ? 'Aa' : '…')),
          h('span', { class: 't' }, ho.title || 'Untitled'));
      })) : h('p', { class: 'empty' }, 'Handouts the GM shares with you will collect here.')));
  } else if (tab === 'inbox') {
    if (ctx.messagesPanel) body.append(ctx.messagesPanel());
    else { // GM preview: read-only
      const threads = threadsOf(view.messages);
      body.append(h('section', { class: 'v-sec' }, h('h2', null, 'Messages'),
        threads.length ? h('div', { class: 'stack' }, threads.map((t) => h('div', { class: 'stack', style: { gap: '6px' } },
          h('b', null, threadTitle(t.parts, view.me, view.roster)), threadEl(t, view.me, view.roster)))) : h('p', { class: 'empty' }, 'No messages yet.')));
    }
  } else if (tab === 'notes') {
    body.append(ctx.notesPanel ? ctx.notesPanel() : h('p', { class: 'empty' }, 'The player’s notes appear here on their own device.'));
  }

  if (tabs.length > 1) {
    const nav = h('nav', { class: 'tabs', 'aria-label': 'Sections' });
    for (const [k, label] of tabs) {
      const b = h('button', { 'aria-current': k === tab ? 'page' : null, onclick: () => ctx.onTab && ctx.onTab(k) }, label);
      if (k === 'inbox' && ctx.unread) b.append(h('span', { class: 'badge' }, ctx.unread));
      nav.append(b);
    }
    root.append(nav);
  }
  return root;
}

function handoutOverlay(ho, onClose, label = 'Close') {
  const img = AssetStore.url(ho.asset);
  const back = h('div', { class: 'reveal', role: 'dialog', 'aria-modal': 'true', 'aria-label': ho.title || 'Handout' },
    ho.eyebrow ? h('div', { class: 'eyebrow' }, ho.eyebrow) : null,
    ho.title ? h('h2', null, ho.title) : null,
    img ? h('img', { src: img, alt: ho.title || '' }) : null,
    ho.body ? h('div', { class: 'body' }, ho.body) : null,
    h('button', { class: 'btn primary', onclick: () => { back.remove(); onClose && onClose(); } }, label));
  document.body.append(back);
  back.querySelector('button').focus();
  return back;
}

/* ============================================================
   Player / table controller
   ============================================================ */
const P = {
  role: 'player', code: null, who: null, view: null, roster: [],
  peer: null, conn: null, status: 'wait', statusText: 'Connecting', retryMs: 1500, retryT: null,
  tab: 'board', seen: { msgs: [], reveal: 0 }, notebook: { pages: [] }, page: null,
  lastFear: null, assetWait: new Set(), revealOpen: false, msgOpen: false,
  thread: null, composeTo: [], drafts: {}, pending: [], notified: new Set(),
};
const pKey = (k) => `hdoc.p.${k}.${P.code}`;

function startViewer(role) {
  P.role = role;
  const q = new URLSearchParams(location.search);
  const fromUrl = (q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  P.code = fromUrl || LS.get('hdoc.p.room', null);
  if (!P.code) return joinScreen();
  LS.set('hdoc.p.room', P.code);
  P.who = role === 'table' ? 'table' : LS.get(pKey('who'), null);
  P.view = LS.get(pKey('view'), null);
  P.seen = LS.get(pKey('seen.' + (P.who || '')), { msgs: [], reveal: 0 });
  if (P.who && P.who !== 'table') { P.notebook = LS.get(pKey('notes.' + P.who), { pages: [] }); P.pending = LS.get(pKey('pending.' + P.who), []); }
  if (P.view) { applyTheme(P.view.theme); renderP(); } else renderWaiting();
  connectP();
  // If the GM goes quiet (closed laptop, reloaded console), reconnect on our own.
  setInterval(() => {
    if (P.status === 'live' && P.conn && Date.now() - (P.lastMsg || Date.now()) > 12000) scheduleRetry('Reconnecting');
  }, 3000);
}

function joinScreen(error) {
  const inp = h('input', { class: 'code-in', maxlength: '5', placeholder: 'Code', autocomplete: 'off', autocapitalize: 'characters', spellcheck: 'false', 'aria-label': 'Room code' });
  const go = () => {
    const c = inp.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (c.length < 4) { inp.focus(); return; }
    const url = new URL(location.href); url.searchParams.set('room', c);
    location.href = url.toString();
  };
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
  appRoot().replaceChildren(h('div', { class: 'join' },
    h('h1', null, 'Join the table'),
    h('p', { class: 'hint' }, 'Enter the room code the GM shared with you.'),
    error ? h('p', { class: 'hint', style: { color: 'var(--danger)' } }, error) : null,
    inp, h('button', { class: 'btn primary', onclick: go }, 'Join')));
  inp.focus();
}

function renderWaiting(text) {
  appRoot().replaceChildren(h('div', { class: 'join' },
    h('h1', null, 'Helianthus Table'),
    h('p', { class: 'status wait' }, h('i'), ' ', text || 'Connecting to the GM'),
    h('p', { class: 'hint' }, 'Room ', h('b', null, P.code), '. This page will fill in as soon as the GM’s console is open.'),
    h('button', { class: 'btn ghost small', onclick: leaveRoom }, 'Use a different code')));
}

function pickScreen() {
  const roster = P.roster || [];
  appRoot().replaceChildren(h('div', { class: 'join' },
    h('h1', null, 'Who are you playing?'),
    h('p', { class: 'hint' }, 'This device will remember your choice.'),
    h('div', { class: 'pick' }, roster.map((r) => h('button', { onclick: () => chooseWho(r.id) }, faceEl(r), r.name))),
    roster.length ? null : h('p', { class: 'empty' }, 'The GM hasn’t added any characters yet.'),
    h('button', { class: 'btn ghost small', onclick: () => chooseWho('table') }, 'Use this screen as the table display')));
}
function chooseWho(id) {
  if (id === 'table') { const url = new URL(location.href); url.hash = 'table'; location.href = url.toString(); location.reload(); return; }
  P.who = id; LS.set(pKey('who'), id);
  const known = LS.get(pKey('seen.' + id), null);
  P.seen = known || { msgs: [], reveal: Date.now() };
  P.freshDevice = !known; // old messages go to the inbox quietly instead of popping up
  LS.set(pKey('seen.' + id), P.seen);
  P.notebook = LS.get(pKey('notes.' + id), { pages: [] });
  P.pending = LS.get(pKey('pending.' + id), []); P.thread = null; P.drafts = {};
  send({ t: 'join', who: 'char:' + id });
  renderWaiting('Joining');
}
function leaveRoom() {
  LS.del('hdoc.p.room');
  const url = new URL(location.href); url.searchParams.delete('room'); url.hash = '';
  location.href = url.toString();
}

/* ---------- connection ---------- */
function setStatus(st, text) {
  P.status = st; P.statusText = text;
  const el = document.querySelector('.v-head .status');
  if (el) { el.className = 'status ' + st; el.lastChild.textContent = text; }
}
function connectP() {
  clearTimeout(P.retryT); P.retryT = null;
  const gen = (P.gen = (P.gen || 0) + 1);
  const live = () => gen === P.gen;
  try { if (P.peer) P.peer.destroy(); } catch {}
  P.conn = null;
  setStatus('wait', P.everLive ? 'Reconnecting' : 'Connecting');
  const peer = new Peer(undefined, peerOptions());
  P.peer = peer;
  peer.on('open', () => {
    if (!live()) return;
    const conn = peer.connect(PEER_PREFIX + P.code, { reliable: true });
    P.conn = conn;
    setTimeout(() => { if (live() && !conn.open) scheduleRetry('Reconnecting'); }, 15000);
    conn.on('open', () => {
      if (!live()) { try { conn.close(); } catch {} return; }
      clearTimeout(P.retryT); P.retryT = null;
      P.retryMs = 1500; P.lastMsg = Date.now(); P.everLive = true;
      setStatus('live', 'Live');
      if (P.who) send({ t: 'join', who: P.who === 'table' ? 'table' : 'char:' + P.who });
      else {
        send({ t: 'hi' });
        // Ask again if the character list hasn't arrived (a dropped first message shouldn't strand anyone).
        const ask = setInterval(() => { if (!live() || P.who || (P.roster && P.roster.length)) clearInterval(ask); else send({ t: 'hi' }); }, 2500);
      }
    });
    conn.on('data', (d) => { if (live()) onDataP(d); });
    conn.on('close', () => { if (live()) scheduleRetry('Reconnecting'); });
    conn.on('error', () => { if (live()) scheduleRetry('Reconnecting'); });
  });
  peer.on('error', (e) => {
    if (!live()) return;
    scheduleRetry(e.type === 'peer-unavailable' ? 'Waiting for the GM' : 'Reconnecting');
  });
  peer.on('disconnected', () => { if (live() && !(P.conn && P.conn.open)) scheduleRetry('Reconnecting'); });
}
/* One pending retry at a time; a fresh connectP() replaces everything from the last attempt. */
function scheduleRetry(text) {
  setStatus('wait', text);
  if (!P.view && !document.querySelector('.pick')) renderWaiting(text);
  if (P.retryT) return;
  P.retryT = setTimeout(connectP, P.retryMs);
  P.retryMs = Math.min(P.retryMs * 1.6, 10000);
}
function send(msg) { try { if (P.conn && P.conn.open) P.conn.send(msg); } catch (e) { console.warn(e); } }

const renderSoon = debounce(() => renderP(), 120);
async function onDataP(msg) {
  if (!msg || typeof msg !== 'object') return;
  P.lastMsg = Date.now();
  if (msg.t === 'ping') { send({ t: 'pong' }); return; }
  if (msg.t === 'hello') {
    P.roster = msg.roster || [];
    requestAssets({ roster: P.roster });
    if (P.role === 'table') return;
    if (!P.who || !P.roster.some((r) => r.id === P.who)) { P.who = null; pickScreen(); }
  } else if (msg.t === 'view') {
    const first = !P.view;
    const prevFear = P.view && P.view.fear ? P.view.fear.value : null;
    P.view = msg.view; LS.set(pKey('view'), P.view);
    if (P.freshDevice && P.view.me) { P.seen.msgs = (P.view.messages || []).map((m) => m.id); saveSeen(); P.freshDevice = false; }
    settlePending();
    if (P.tab === 'inbox' && P.thread) markThreadSeen(P.thread);
    P.fearPulseFrom = prevFear != null && P.view.fear && P.view.fear.value > prevFear ? prevFear : null;
    applyTheme(P.view.theme);
    await requestAssets(P.view);
    if (P.who && P.who !== 'table' && first) send({ t: 'notes', notebook: P.notebook });
    renderP();
    checkPopups();
  } else if (msg.t === 'asset') {
    if (msg.asset && msg.asset.id) { await AssetStore.put(msg.asset); P.assetWait.delete(msg.asset.id); if (P.view) applyTheme(P.view.theme); renderSoon(); checkPopups(); }
  } else if (msg.t === 'notes') {
    const merged = mergeNotebook(P.notebook, msg.notebook);
    P.notebook = merged; LS.set(pKey('notes.' + P.who), merged);
    if (P.tab === 'notes' && !document.activeElement?.closest?.('.notes')) renderP();
  } else if (msg.t === 'sayfail') {
    const p = P.pending.find((x) => x.cid === msg.cid);
    P.pending = P.pending.filter((x) => x.cid !== msg.cid); savePending();
    if (p) { const k = threadKey([P.who, ...p.to]); if (!P.drafts[k]) P.drafts[k] = p.text; }
    toast('Not sent. ' + (msg.why || ''), 5000);
    renderP();
  } else if (msg.t === 'kicked') {
    LS.del(pKey('who')); P.who = null; pickScreen();
  }
}
async function requestAssets(view) {
  const need = [];
  for (const id of collectAssetIds(view)) {
    if (AssetStore.mem.has(id) || P.assetWait.has(id)) continue;
    const a = await AssetStore.get(id);
    if (!a) { need.push(id); P.assetWait.add(id); }
  }
  if (need.length) send({ t: 'need', ids: need });
}

/* ---------- popups: private messages and handout reveals ---------- */
function saveSeen() { LS.set(pKey('seen.' + (P.who || '')), P.seen); }
function checkPopups() {
  const v = P.view; if (!v) return;
  // A wiki card the GM is showing. It comes down when the GM takes it down.
  const wc = v.wikiCard;
  if (P.wikiEl && (!wc || String(wc.at) !== P.wikiEl.dataset.at)) { P.wikiEl.remove(); P.wikiEl = null; }
  if (wc && !P.wikiEl && !P.revealOpen && (P.role === 'table' || wc.at > (P.seen.wiki || 0))) {
    if (wc.asset && !AssetStore.mem.has(wc.asset)) return; // wait for the picture; checked again when it arrives
    if (P.msgOpen) { const m = document.querySelector('.modal-back'); if (m) m.style.zIndex = '120'; }
    const at = wc.at;
    P.wikiEl = handoutOverlay({ title: wc.title, eyebrow: wc.cat, asset: wc.asset, body: wc.text }, () => { P.wikiEl = null; P.seen.wiki = at; saveSeen(); checkPopups(); }, 'Close');
    P.wikiEl.dataset.at = String(at);
    P.wikiEl.classList.add('wiki-card');
    return;
  }
  if (P.wikiEl) return;
  if (v.reveal && v.reveal.at > (P.seen.reveal || 0) && !P.revealOpen) {
    const ho = (v.handouts || []).find((x) => x.id === v.reveal.id);
    if (ho && ho.asset && !AssetStore.mem.has(ho.asset)) return; // wait for the image; checked again when it arrives
    if (ho) {
      P.seen.reveal = v.reveal.at; saveSeen();
      P.revealOpen = true;
      handoutOverlay(ho, () => { P.revealOpen = false; checkPopups(); });
      return;
    }
  }
  if (P.role === 'table' || !v.messages || P.msgOpen || P.revealOpen) return;
  const seen = new Set(P.seen.msgs || []);
  const viewingKey = P.tab === 'inbox' ? P.thread : null;
  const unseen = v.messages.filter((m) => m.from !== v.me && !seen.has(m.id) && threadKey(msgParts(m)) !== viewingKey).sort((a, b) => a.at - b.at);
  // Messages between players arrive quietly: a badge and a short notice.
  for (const m of unseen) if (m.from !== 'gm' && !P.notified.has(m.id)) {
    P.notified.add(m.id);
    toast(`${whoName(m.from, v.roster)}: ${m.text.length > 70 ? m.text.slice(0, 70) + '…' : m.text}`, 4500);
  }
  // Messages from the GM pop up.
  const fresh = unseen.find((m) => m.from === 'gm');
  if (fresh) {
    P.msgOpen = true;
    const parts = msgParts(fresh), key = threadKey(parts);
    const others = parts.filter((p) => p !== 'gm' && p !== v.me);
    modal((box, close) => {
      box.append(h('h3', null, others.length ? 'Message from the GM' : 'Private message from the GM'),
        h('p', { class: 'small-text muted' }, others.length ? 'Also sent to ' + others.map((id) => whoName(id, v.roster)).join(', ') + '.' : 'Only you can see this.'),
        h('div', { class: 'msg', style: { marginTop: '10px' } }, h('div', { class: 'txt' }, fresh.text)),
        h('div', { class: 'row end' },
          v.msg && v.msg.send ? h('button', { class: 'btn', onclick: () => close('reply') }, 'Reply') : null,
          h('button', { class: 'btn primary', onclick: () => close(true) }, 'Got it')));
    }).then((r) => {
      P.seen.msgs = [...(P.seen.msgs || []), fresh.id]; saveSeen();
      P.msgOpen = false;
      if (r === 'reply') openThread(key);
      renderP(); checkPopups();
    });
  }
}

/* ---------- messages ---------- */
function savePending() { if (P.who && P.who !== 'table') LS.set(pKey('pending.' + P.who), P.pending); }
function markThreadSeen(key) {
  const v = P.view; if (!v || !v.messages) return;
  const ids = v.messages.filter((m) => threadKey(msgParts(m)) === key).map((m) => m.id);
  const seen = new Set(P.seen.msgs || []);
  if (ids.every((id) => seen.has(id))) return;
  P.seen.msgs = [...seen, ...ids]; saveSeen();
}
function openThread(key) { P.tab = 'inbox'; P.thread = key; P.toBottom = true; markThreadSeen(key); }
/* Drop pending messages the GM has confirmed; resend the rest once per connection. */
function settlePending() {
  const have = new Set((P.view.messages || []).map((m) => m.cid).filter(Boolean));
  const before = P.pending.length;
  P.pending = P.pending.filter((p) => !have.has(p.cid));
  if (P.pending.length !== before) savePending();
  if (P.pending.length && P.resentGen !== P.gen) {
    P.resentGen = P.gen;
    for (const p of P.pending) send({ t: 'say', cid: p.cid, to: p.to, text: p.text });
  }
}
function sendSay(to, text) {
  const p = { id: 'pending-' + uid(), cid: 'c' + uid() + uid(), from: P.who, to: [...to], text: text.slice(0, MSG_MAX), at: Date.now(), pending: true };
  P.pending.push(p); savePending();
  send({ t: 'say', cid: p.cid, to: p.to, text: p.text });
  P.resentGen = P.gen;
  if (P.thread === 'new' && document.activeElement && document.activeElement.blur) document.activeElement.blur();
  P.thread = threadKey([P.who, ...to]); P.toBottom = true;
  renderP();
}
function messagesPanel() {
  const v = P.view, me = v.me, roster = v.roster || [];
  const opts = v.msg || { send: false, p2p: false };
  const all = [...(v.messages || []), ...P.pending];
  const threads = threadsOf(all);
  const seen = new Set(P.seen.msgs || []);
  const offline = P.status !== 'live';
  const sendNote = offline ? 'Not connected. It will send when you reconnect.' : 'The GM can read every message.';
  const back = h('button', { class: 'btn ghost small', onclick: () => { P.thread = null; renderP(); window.scrollTo(0, 0); } }, '‹ All messages');

  if (P.thread === 'new') {
    if (!opts.send) { P.thread = null; return messagesPanel(); }
    const others = roster.filter((r) => r.id !== me);
    if (!opts.p2p) P.composeTo = ['gm'];
    P.composeTo = P.composeTo.filter((id) => id === 'gm' || others.some((r) => r.id === id));
    const same = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
    const setTo = (ids) => { P.composeTo = [...new Set(ids)]; renderP(); };
    const toggle = (id) => setTo(P.composeTo.includes(id) ? P.composeTo.filter((x) => x !== id) : [...P.composeTo, id]);
    const chip = (id, label, face) => h('button', { class: 'to-chip' + (P.composeTo.includes(id) ? ' on' : ''), 'aria-pressed': P.composeTo.includes(id) ? 'true' : 'false', onclick: () => toggle(id) }, face, label);
    const everyone = ['gm', ...others.map((r) => r.id)];
    const group = v.myGroup && v.myGroup.members.length ? v.myGroup.members : null;
    const picker = opts.p2p ? h('div', { class: 'stack', style: { gap: '10px' } },
      h('div', { class: 'row', style: { gap: '6px' } },
        group ? h('button', { class: 'btn small' + (same(P.composeTo, group) ? ' on' : ''), onclick: () => setTo(group) }, 'My group' + (v.myGroup.name ? ` (${v.myGroup.name})` : '')) : null,
        others.length ? h('button', { class: 'btn small' + (same(P.composeTo, everyone) ? ' on' : ''), onclick: () => setTo(everyone) }, 'Whole party') : null,
        P.composeTo.length ? h('button', { class: 'btn small ghost', onclick: () => setTo([]) }, 'Clear') : null),
      h('div', { class: 'to-chips' }, chip('gm', 'GM', whoFace('gm')), others.map((r) => chip(r.id, r.name, faceEl(r)))))
      : h('p', { class: 'hint' }, 'Messages go to the GM.');
    const existing = P.composeTo.length && threads.some((t) => t.key === threadKey([me, ...P.composeTo]));
    return h('section', { class: 'v-sec stack' }, back, h('h2', { style: { marginBottom: '0' } }, 'New message'),
      h('span', { class: 'ctl-label' }, 'To'), picker,
      existing ? h('p', { class: 'hint' }, 'This adds to your conversation with them.') : null,
      composerEl({ key: 'new', drafts: P.drafts, placeholder: 'Write a message', disabled: !P.composeTo.length, onSend: (t) => sendSay(P.composeTo, t), note: P.composeTo.length ? sendNote : 'Choose who it goes to.' }));
  }

  const cur = P.thread ? threads.find((t) => t.key === P.thread) : null;
  if (cur) {
    const others = cur.parts.filter((p) => p !== me);

function renderP() {
  if (!P.view) return renderWaiting(P.statusText);
  const v = P.view;
  const seen = new Set(P.seen.msgs || []);
  const unread = (v.messages || []).filter((m) => m.from !== v.me && !seen.has(m.id)).length;
  const me = (v.roster || []).find((r) => r.id === v.me);
  const menu = P.role === 'player' ? h('button', { class: 'btn ghost icon-btn', title: 'Options', 'aria-label': 'Options', onclick: () => {
    modal((box, close) => box.append(h('h3', null, me ? `Playing ${me.name}` : 'Options'),
      h('div', { class: 'stack' },
        h('button', { class: 'btn', onclick: () => { close(); LS.del(pKey('who')); P.who = null; P.view = null; pickScreen(); send({ t: 'leave' }); } }, 'Switch character'),
        h('button', { class: 'btn', onclick: () => { close(); leaveRoom(); } }, 'Leave this room'),
        h('button', { class: 'btn ghost', onclick: () => close() }, 'Close'))));
  } }, '⋯') : null;
  const a = document.activeElement;
  const typingNotes = P.tab === 'notes' && a && a.matches && a.matches('.notes input, .notes textarea');
  const scroll = window.scrollY;
  const screen = viewerScreen(v, {
    mode: P.role, tab: P.tab, status: P.status, statusText: P.statusText, unread, seen: P.seen, menu,
    fearPulseFrom: P.fearPulseFrom,
    onTab: (k) => {
      if (k === 'inbox' && P.tab === 'inbox') P.thread = null; // tapping Messages again returns to the list
      P.tab = k;
      if (k === 'inbox' && P.thread && P.thread !== 'new') { markThreadSeen(P.thread); P.toBottom = true; }
      renderP(); if (!P.toBottom) window.scrollTo(0, 0);
    },
    notesPanel, messagesPanel, onOpenHandout: (ho) => handoutOverlay(ho),
  });
  P.fearPulseFrom = null;
  const typingMsg = !typingNotes && P.tab === 'inbox' && a && a.matches && a.matches('.composer textarea');
  const nearBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 120;
  if (typingNotes || typingMsg) {
    // Leave the box they're typing in alone (rebuilding it can drop a phone's keyboard); refresh around it.
    const cur = appRoot();
    for (const sel of ['.v-head', '.tabs', ...(typingMsg ? ['.thread'] : [])]) { const o = cur.querySelector(sel), n = screen.querySelector(sel); if (o && n) o.replaceWith(n); }
    if (typingMsg && !a.dataset.hooked) { a.dataset.hooked = '1'; a.addEventListener('blur', () => renderSoon()); }
    if (typingMsg && (P.toBottom || nearBottom)) window.scrollTo(0, document.documentElement.scrollHeight);
    P.toBottom = false;
    return;
  }

  if (inThread && (P.toBottom || nearBottom)) window.scrollTo(0, document.documentElement.scrollHeight);
  else window.scrollTo(0, scroll);
  P.toBottom = false;
}


/* ============================================================
   GM console. Holds the only copy of campaign state, filters it
   per viewer, and sends each player only what they may see.
   ============================================================ */
const G = {
  S: null, notes: {}, peer: null, clients: new Map(), section: 'clocks',
  status: 'wait', statusText: 'Opening the room', idTries: 0,
  selChip: null, previewWho: null, previewTab: 'board', lastDragSend: 0,
  drafts: {}, msgThread: null, draftTo: [],
};
const activeRoster = () => G.S.roster.filter((r) => r.active);

async function startGM() {
  await AssetStore.all();
  G.S = migrateState(LS.get('hdoc.gm.state', null) || defaultState());
  G.notes = LS.get('hdoc.gm.notes', {});
  wikiLoad();
  normalizeGroups();
  await seedContent();
  saveGM();
  // The wiki can be popped out into its own window; both windows share this browser's storage.
  window.addEventListener('storage', (e) => {
    if (e.key === 'hdoc.gm.wiki') { wikiLoad(); AssetStore.all().then(() => { if (G.section === 'wiki' && !typing()) renderGM(); }); }
    if (e.key === 'hdoc.gm.wikiReq' && e.newValue) { try { const r = JSON.parse(e.newValue); if (r.show) applyWikiShow(r.show); else if (r.hide) hideWikiShow(); } catch {} }
  });
  applyTheme(G.S.theme);
  document.title = 'GM — ' + (G.S.title || APP.name);
  renderGM();
  hostPeer();
  // Heartbeat: keeps phones' connections honest and clears out devices that have gone away.
  setInterval(() => {
    const now = Date.now();
    for (const [id, c] of G.clients) {
      if (now - (c.lastSeen || now) > 16000) { try { c.conn.close(); } catch {} G.clients.delete(id); renderConns(); continue; }
      safeSend(c.conn, { t: 'ping' });
    }
  }, 4000);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.modal-back')) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); setFear(G.S.fear.value + 1); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); setFear(G.S.fear.value - 1); }
  });
}
function saveGM() { LS.set('hdoc.gm.state', G.S); }

/* Built-in content (player-safe only: the page itself is public). Added once; deleting it keeps it deleted. */
async function seedContent() {
  const S = G.S;
  for (const sm of SEED_MAPS) {
    if (S.seeded.includes(sm.id)) continue;
    for (const id of sm.assets) if (!AssetStore.mem.has(id) && SEED_IMAGES[id]) await AssetStore.put({ id, ...SEED_IMAGES[id] });
    const live = sm.scenario === S.scenario;
    const sc = S.scenarios.find((x) => x.id === sm.scenario);
    if (live || sc) {
      const maps = live ? S.maps : (sc.maps = sc.maps || []);
      if (!maps.some((m) => m.id === sm.map.id)) maps.push(clone(sm.map));
      if (live && !S.activeMap) S.activeMap = sm.map.id;
      if (!live && !sc.activeMap) sc.activeMap = sm.map.id;
    }
    S.seeded.push(sm.id);
  }
}

/* ---------- scenarios: park the current one's clocks, maps and fight, bring out another's ---------- */
function stashScenario() {
  const S = G.S, sc = S.scenarios.find((x) => x.id === S.scenario); if (!sc) return;
  Object.assign(sc, { clocks: S.clocks, maps: S.maps, activeMap: S.activeMap, fight: S.adversaries.active });
}
function loadScenario(id) {
  const S = G.S, sc = S.scenarios.find((x) => x.id === id); if (!sc) return;
  S.scenario = id; S.clocks = sc.clocks || []; S.maps = sc.maps || []; S.activeMap = sc.activeMap ?? (S.maps[0] ? S.maps[0].id : null); S.adversaries.active = sc.fight || [];
  for (const k of ['clocks', 'maps', 'activeMap', 'fight']) delete sc[k];
}
function switchScenario(id) {
  if (id === G.S.scenario) return;
  stashScenario(); loadScenario(id); commit();
  toast(`Now running ${G.S.scenarios.find((x) => x.id === id).name}.`);
}
function scenarioCounts(sc) {
  const S = G.S, live = sc.id === S.scenario;
  const c = (live ? S.clocks : sc.clocks || []).length, m = (live ? S.maps : sc.maps || []).length, f = (live ? S.adversaries.active : sc.fight || []).length;
  return `${c} clock${c === 1 ? '' : 's'} · ${m} map${m === 1 ? '' : 's'}${f ? ` · ${f} in the fight` : ''}`;
}
function manageScenarios() {
  modal((box, close) => {
    const draw = () => {
      const S = G.S;
      box.replaceChildren(h('h3', null, 'Scenarios'),
        h('p', { class: 'hint' }, 'Each scenario keeps its own clocks, maps and fight. The party, Fear, handouts, messages and notes are shared by all of them.'),
        h('div', { class: 'stack', style: { margin: '12px 0' } }, S.scenarios.map((sc) => h('div', { class: 'scn-row' + (sc.id === S.scenario ? ' cur' : '') },
          textInput(sc.name, (v) => { sc.name = v; saveGM(); }, { 'aria-label': 'Scenario name', class: 'grow' }),
          h('span', { class: 'small-text muted' }, scenarioCounts(sc)),
          sc.id === S.scenario ? h('span', { class: 'small-text', style: { color: 'var(--accent)' } }, 'Running')
            : h('button', { class: 'btn small', onclick: () => { switchScenario(sc.id); draw(); } }, 'Switch to'),
          h('button', { class: 'btn small ghost danger', disabled: S.scenarios.length < 2, onclick: async () => {
            if (!(await ask(`Delete ${sc.name}?`, 'Its clocks, maps and fight are deleted with it.', 'Delete scenario', true))) { draw(); return; }
            if (sc.id === S.scenario) { const other = S.scenarios.find((x) => x.id !== sc.id); stashScenario(); loadScenario(other.id); }
            S.scenarios = S.scenarios.filter((x) => x !== sc); commit(); draw();
          } }, 'Delete')))),
        h('div', { class: 'row end' },
          h('button', { class: 'btn', onclick: async () => {
            const name = await promptText('New scenario', 'Name', ''); if (!name) { draw(); return; }
            const sc = blankScenario(name.trim()); G.S.scenarios.push(sc); switchScenario(sc.id); draw();
          } }, 'New scenario'),
          h('button', { class: 'btn primary', onclick: () => { close(); renderGM(); } }, 'Done')));
    };
    draw();
  });
}
function scenarioPicker() {
  const S = G.S;
  return h('label', { class: 'scn-pick' }, h('span', { class: 'muted small-text' }, 'Scenario'),
    h('select', { 'aria-label': 'Scenario', onchange: (e) => { const v = e.target.value; if (v === '__manage') { e.target.value = S.scenario; manageScenarios(); } else switchScenario(v); } },
      S.scenarios.map((x) => h('option', { value: x.id, selected: x.id === S.scenario }, x.name)),
      h('option', { value: '__manage' }, 'Manage scenarios…')));
}
const broadcastSoon = debounce(broadcast, 50);
function commit(opts = {}) {
  saveGM();
  broadcastSoon();
  if (opts.render === false) refreshPreview(); else renderGM();
}

/* ---------- networking ---------- */
function setGMStatus(st, text) {
  G.status = st; G.statusText = text;
  const el = $('#gm-status');
  if (el) { el.className = 'status ' + st; el.lastChild.textContent = text; }
}
function hostPeer() {
  try { if (G.peer) G.peer.destroy(); } catch {}
  setGMStatus('wait', 'Opening the room');
  const peer = new Peer(PEER_PREFIX + G.S.room, peerOptions());
  G.peer = peer;
  peer.on('open', () => { G.idTries = 0; setGMStatus('live', 'Room open'); });
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      G.clients.set(conn.connectionId, { conn, who: null, last: null, lastSeen: Date.now() });
      safeSend(conn, helloMsg());
      renderConns();
    });
    conn.on('data', (d) => onClientData(conn, d));
    const gone = () => { G.clients.delete(conn.connectionId); renderConns(); };
    conn.on('close', gone);
    conn.on('error', gone);
  });
  peer.on('disconnected', () => {
    if (peer !== G.peer || peer.destroyed) return;
    setGMStatus('wait', 'Reconnecting');
    setTimeout(() => { try { if (peer === G.peer && !peer.destroyed) peer.reconnect(); } catch {} }, 1500);
  });
  peer.on('error', (e) => {
    if (peer !== G.peer) return;
    if (e.type === 'unavailable-id') {
      G.idTries++;
      setGMStatus('wait', 'This room is open in another tab or window');
      if (G.idTries < 8) setTimeout(() => { if (peer === G.peer) hostPeer(); }, 4000);
    } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) {
      setGMStatus('wait', 'Reconnecting');
      setTimeout(() => { if (peer === G.peer) hostPeer(); }, 3000);
    } else console.warn('peer error', e.type, e);
  });
}
function helloMsg() { return { t: 'hello', title: G.S.title, roster: activeRoster().map((r) => ({ id: r.id, name: r.name, color: r.color, asset: r.asset })) }; }
function safeSend(conn, msg) { try { if (conn.open) conn.send(msg); } catch (e) { console.warn(e); } }

function onClientData(conn, msg) {
  const c = G.clients.get(conn.connectionId);
  if (!c || !msg || typeof msg !== 'object') return;
  c.lastSeen = Date.now();
  if (msg.t === 'pong') return;
  if (msg.t === 'hi') { safeSend(conn, helloMsg()); return; }
  if (msg.t === 'join') {
    if (msg.who === 'table') c.who = 'table';
    else if (typeof msg.who === 'string' && msg.who.startsWith('char:')) {
      const id = msg.who.slice(5);
      if (!activeRoster().some((r) => r.id === id)) { safeSend(conn, { t: 'kicked' }); return; }
      c.who = msg.who;
      if (G.notes[id]) safeSend(conn, { t: 'notes', notebook: G.notes[id] });
    } else return;
    sendView(c, true);
    renderConns();
  } else if (msg.t === 'leave') {
    c.who = null; renderConns();
  } else if (msg.t === 'need' && Array.isArray(msg.ids)) {
    const allowed = c.who ? collectAssetIds(deriveView(c.who)) : collectAssetIds({ roster: activeRoster() });
    for (const id of msg.ids.slice(0, 300)) {
      const a = AssetStore.mem.get(id);
      if (a && allowed.has(id)) safeSend(conn, { t: 'asset', asset: a });
    }
  } else if (msg.t === 'notes' && c.who && c.who.startsWith('char:') && msg.notebook && Array.isArray(msg.notebook.pages)) {
    const id = c.who.slice(5);
    const clean = { pages: msg.notebook.pages.slice(0, 300).filter((p) => p && typeof p.id === 'string').map((p) => ({
      id: p.id.slice(0, 40), title: String(p.title || '').slice(0, 200), body: String(p.body || '').slice(0, 200000),
      created: Number(p.created) || 0, at: Number(p.at) || 0, deleted: !!p.deleted })) };
    const merged = mergeNotebook(G.notes[id], clean);
    G.notes[id] = merged;
    LS.set('hdoc.gm.notes', G.notes);
    for (const o of G.clients.values()) if (o.who === c.who && o !== c) safeSend(o.conn, { t: 'notes', notebook: merged });
    safeSend(conn, { t: 'notes', notebook: merged });
    if (G.section === 'notes' && !typing()) renderGM();
  } else if (msg.t === 'say' && c.who && c.who.startsWith('char:')) {
    onPlayerSay(c, msg);
  }
}

/* A player sent a message. Check it against the room's rules, store it, pass it on. */
function onPlayerSay(c, msg) {
  const S = G.S, me = c.who.slice(5);
  const cid = String(msg.cid || '').slice(0, 40);
  const fail = (why) => safeSend(c.conn, { t: 'sayfail', cid, why });
  if (cid && S.messages.some((x) => x.cid === cid && x.from === me)) { sendView(c, true); return; } // already have it
  if (!S.modules.messages || !S.msgOpts.playersSend) return fail('The GM has turned off player messages.');
  const text = String(msg.text || '').trim().slice(0, MSG_MAX);
  if (!text) return fail('The message was empty.');
  const valid = new Set(['gm', ...activeRoster().map((r) => r.id)]);
  const to = [...new Set((Array.isArray(msg.to) ? msg.to : []).filter((x) => typeof x === 'string' && valid.has(x) && x !== me))];
  if (!to.length) return fail('Nobody to send it to.');
  const key = threadKey([me, ...to]);
  if (!S.msgOpts.playerToPlayer && to.some((x) => x !== 'gm')) {
    const existing = to.includes('gm') && S.messages.some((x) => threadKey(msgParts(x)) === key);
    if (!existing) return fail('Right now, messages can only go to the GM.');
  }
  const now = Date.now();
  c.sent = (c.sent || []).filter((t) => now - t < 60000);
  if (c.sent.length >= 30) return fail('Too many messages at once. Wait a moment.');
  c.sent.push(now);
  S.messages.push({ id: 'x' + uid(), from: me, to, text, at: now, cid });
  const viewing = G.section === 'messages' && G.msgThread === key;
  if (viewing) S.msgRead[key] = now;
  saveGM(); broadcastSoon();
  if (G.section === 'messages') renderGM();
  else { const nav = $('.gm-nav'); if (nav) nav.replaceWith(gmNav()); refreshPreview(); }
  if (to.includes('gm') && !viewing) toast(`${whoName(me, S.roster)}: ${text.length > 90 ? text.slice(0, 90) + '…' : text}`, 5000);
}

/* What a given viewer is allowed to see. Anything hidden never leaves this browser. */
function deriveView(who) {
  const S = G.S, m = S.modules;
  const isTable = who === 'table';
  const me = !isTable && who ? who.slice(5) : null;
  const roster = activeRoster().map((r) => ({ id: r.id, name: r.name, color: r.color, asset: r.asset, hope: m.hope ? r.hope : undefined }));
  const v = { title: S.title, subtitle: S.subtitle, theme: S.theme, roster, me, hope: !!m.hope };
  if (m.fear) v.fear = { value: S.fear.value, max: S.fear.max };
  if (m.clocks) v.clocks = S.clocks.filter((c) => c.visible !== false).map((c) => {
    const o = { id: c.id, name: c.name, type: c.type, style: c.style, size: c.size, value: c.value, color: c.color, asset: c.asset || null };
    if (c.type === 'tug') Object.assign(o, { floor: c.floor, lowLabel: c.lowLabel, highLabel: c.highLabel });
    if (c.type === 'nodes') Object.assign(o, { shape: c.shape, names: !!c.names, legend: !!c.legend,
      a: { color: c.a.color, label: c.legend ? c.a.label : '' }, b: { color: c.b.color, label: c.legend ? c.b.label : '' },
      nodes: c.nodes.map((n) => ({ id: n.id, s: n.s, name: c.names ? n.name : '' })) });
    return o;
  });
  if (m.party) v.groups = S.groups.map((g) => {
    const member = me && g.members.includes(me);
    return { id: g.id, name: g.name, members: g.members.filter((id) => roster.some((r) => r.id === id)),
      location: g.private && !member ? null : g.location, spotlight: S.spotlight === g.id, briefing: member ? (g.briefing || '') : '' };
  });
  if (m.map) {
    const mp = S.maps.find((x) => x.id === S.activeMap);
    if (mp) v.map = { name: mp.name, asset: mp.asset, grid: mp.grid, gridN: mp.gridN, tokens: (mp.tokens || []).filter((t) => !t.hidden).map((t) => ({ ...t })) };
  }
  if (m.handouts) {
    v.handouts = S.handouts.filter((ho) => ho.share && (ho.share.all || (me && ho.share.to.includes(me))))
      .filter((ho) => !isTable || ho.share.all)
      .map((ho) => ({ id: ho.id, title: ho.title, kind: ho.kind, asset: ho.asset || null, body: ho.body || '', at: ho.sharedAt || ho.at }));
    if (S.reveal && v.handouts.some((ho) => ho.id === S.reveal.id)) v.reveal = { id: S.reveal.id, at: S.reveal.at };
  }
  if (m.messages && me) {
    v.messages = S.messages.filter((x) => msgParts(x).includes(me))
      .map((x) => ({ id: x.id, from: x.from || 'gm', to: x.to, text: x.text, at: x.at, cid: x.from === me ? x.cid : undefined }));
    v.msg = { send: !!S.msgOpts.playersSend, p2p: !!(S.msgOpts.playersSend && S.msgOpts.playerToPlayer) };
    const g = S.groups.find((x) => x.members.includes(me));
    if (m.party && S.groups.length > 1 && g) v.myGroup = { name: g.name, members: g.members.filter((id) => id !== me) };
  }
  if (m.notes && me) v.notes = true;
  const w = S.wikiShow;
  if (w && (w.all || (me && w.to.includes(me)))) v.wikiCard = { title: w.title, cat: w.cat, text: w.text, asset: w.asset || null, at: w.at };
  return v;
}

  c.last = js;

function normalizeGroups() {
  const S = G.S, active = activeRoster().map((r) => r.id);
  if (!S.groups.length) S.groups.push({ id: 'g' + uid(), name: 'The party', location: '', members: [], private: false, briefing: '' });
  const seen = new Set();
  for (const g of S.groups) g.members = g.members.filter((id) => active.includes(id) && !seen.has(id) && seen.add(id));
  for (const id of active) if (!seen.has(id)) S.groups[0].members.push(id);
  if (S.spotlight && !S.groups.some((g) => g.id === S.spotlight)) S.spotlight = null;
}
