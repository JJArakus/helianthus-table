function secParty() {
  const S = G.S;
  const byId = Object.fromEntries(S.roster.map((r) => [r.id, r]));
  const moveTo = (cid, gid) => {
    for (const g of S.groups) g.members = g.members.filter((x) => x !== cid);
    S.groups.find((g) => g.id === gid).members.push(cid);
    G.selChip = null; commit();
  };
  const groups = S.groups.map((g, gi) => {
    const zone = h('div', { class: 'members', 'aria-label': `Members of ${g.name}` },
      g.members.map((cid) => {
        const ch = byId[cid]; if (!ch) return null;
        const chip = h('span', { class: 'member' + (G.selChip === cid ? ' sel' : ''), draggable: 'true', tabindex: '0', role: 'button', 'aria-label': `${ch.name}. Press to pick up, then choose a group.` },
          faceEl(ch), ch.name, S.modules.hope ? hopePips(ch.hope) : null);
        chip.addEventListener('dragstart', (e) => { e.dataTransfer.setData('text/plain', cid); e.dataTransfer.effectAllowed = 'move'; });
        const pick = (e) => { e.stopPropagation(); G.selChip = G.selChip === cid ? null : cid; renderGM(); };
        chip.addEventListener('click', pick);
        chip.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(e); } });
        return chip;
      }));
    const card = h('div', { class: 'ed-group' + (S.spotlight === g.id ? ' spot' : '') },
      h('div', { class: 'row' }, textInput(g.name, (v) => { g.name = v; commit({ render: false }); }, { class: 'grow', 'aria-label': 'Group name', placeholder: 'Group name' })),
      textInput(g.location, (v) => { g.location = v; commit({ render: false }); }, { placeholder: 'Where they are', 'aria-label': 'Location' }),
      zone,
      h('textarea', { placeholder: 'Briefing — only this group sees it', 'aria-label': 'Briefing for this group', style: { minHeight: '60px' }, oninput: (e) => { g.briefing = e.target.value; commit({ render: false }); } }, g.briefing || ''),
      h('div', { class: 'row' },
        switchEl('Private location', !!g.private, (v) => { g.private = v; commit(); }, 'Other groups see “Location unknown”'),
        h('button', { class: 'btn small' + (S.spotlight === g.id ? ' primary' : ''), onclick: () => { S.spotlight = S.spotlight === g.id ? null : g.id; commit(); } }, S.spotlight === g.id ? 'In the spotlight' : 'Spotlight'),
        S.groups.length > 1 ? h('button', { class: 'btn small ghost danger', onclick: () => {
          S.groups[gi === 0 ? 1 : 0].members.push(...g.members); S.groups.splice(gi, 1); normalizeGroups(); commit();
        } }, 'Remove group') : null));
    card.querySelector('textarea').value = g.briefing || '';
    card.addEventListener('dragover', (e) => { e.preventDefault(); card.classList.add('drop'); });
    card.addEventListener('dragleave', () => card.classList.remove('drop'));
    card.addEventListener('drop', (e) => { e.preventDefault(); card.classList.remove('drop'); const cid = e.dataTransfer.getData('text/plain'); if (cid) moveTo(cid, g.id); });
    card.addEventListener('click', (e) => { if (G.selChip && !e.target.closest('input, textarea, button, label')) moveTo(G.selChip, g.id); });

  });

      h('button', { class: 'btn small', disabled: S.groups.length < 2, onclick: () => {

/* ---------- Map ---------- */
function secMap() {
  const S = G.S;
  const mp = S.maps.find((x) => x.id === S.activeMap) || null;
  const newMap = async (withImage) => {
    let asset = null;
    if (withImage) { const [f] = await pickFile('image/*'); if (!f) return; try { const a = await ingestImage(f, 2400); await AssetStore.put(a); asset = a.id; } catch { toast('That file couldn’t be read as an image.'); return; } }
    const name = await promptText('Name this map', 'Map name', withImage ? '' : 'Battlefield'); if (name == null) return;
    const m = { id: 'm' + uid(), name: name || 'Map', asset, grid: !withImage, gridN: 16, tokens: [] };
    S.maps.push(m); S.activeMap = m.id; commit();
  };
  const head = secHead('Map', 'map', 'Players see the active map. Drag tokens to place them; hidden tokens stay on your screen only.');
  const toolbar = h('div', { class: 'toolbar' },
    h('button', { class: 'btn small', onclick: () => newMap(true) }, 'New map from image'),
    h('button', { class: 'btn small', onclick: () => newMap(false) }, 'New blank map'),
    S.maps.length > 1 ? h('select', { 'aria-label': 'Active map', onchange: (e) => { S.activeMap = e.target.value; commit(); } },
      S.maps.map((m) => h('option', { value: m.id, selected: m.id === S.activeMap }, m.name))) : null);
  if (!mp) return h('div', null, head, toolbar, h('p', { class: 'empty' }, 'No map yet. Start with an image of the space, or a blank grid.'));
  const box = renderMap(mp, S.roster, { edit: true, gm: G.gmLayer });
  box.addEventListener('pointerdown', (e) => {
    const tokEl = e.target.closest('.tok'); if (!tokEl) return;
    e.preventDefault();
    const t = mp.tokens.find((x) => x.id === tokEl.dataset.id); if (!t) return;
    const rect = box.getBoundingClientRect();
    tokEl.setPointerCapture(e.pointerId);
    const move = (ev) => {
      t.x = clamp(((ev.clientX - rect.left) / rect.width) * 100, 0, 100);
      t.y = clamp(((ev.clientY - rect.top) / rect.height) * 100, 0, 100);
      tokEl.style.left = t.x + '%'; tokEl.style.top = t.y + '%';
      if (Date.now() - G.lastDragSend > 150) { G.lastDragSend = Date.now(); broadcast(); }
    };
    const up = () => { tokEl.removeEventListener('pointermove', move); commit({ render: false }); };
    tokEl.addEventListener('pointermove', move);
    tokEl.addEventListener('pointerup', up, { once: true });
    tokEl.addEventListener('pointercancel', up, { once: true });

}
function gmUnreadTotal() { return threadsOf(G.S.messages).reduce((n, t) => n + gmUnread(t), 0); }

}

/* ---------- Room and backup ---------- */

    const assets = await AssetStore.all();
    const used = collectAssetIds({ S, W: G.W });
    const blob = new Blob([JSON.stringify({ app: 'helianthus-table', version: APP.version, exported: Date.now(), state: S, notes: G.notes, wiki: G.W, assets: assets.filter((a) => used.has(a.id)) })], { type: 'application/json' });
    const a = h('a', { href: URL.createObjectURL(blob), download: `helianthus-table-backup-${new Date().toISOString().slice(0, 10)}.json` });

    toast('Backup saved to your downloads.');
  };

/* ============================================================
   Wiki: the GM's reference. Lives only in the GM's browser
   (never in campaign state, never sent to players). An entry
   can be shown to players, and then only its player-safe text
   travels.
   ============================================================ */
const WIKI_CATS = ['Party', 'People', 'Places', 'Factions', 'Lore', 'Creatures', 'Items'];
const WIKI_KEY = 'hdoc.gm.wiki';

function wikiLoad() {
  const w = LS.get(WIKI_KEY, null);
  G.W = { entries: Array.isArray(w && w.entries) ? w.entries.map(wikiNorm) : [] };
}
function wikiSave() {
  if (!LS.set(WIKI_KEY, G.W)) toast('The wiki couldn’t be saved. This browser’s storage may be full.');
}
function wikiNorm(e) {
  const list = (v) => (Array.isArray(v) ? v : String(v || '').split(',')).map((x) => String(x).trim()).filter(Boolean);
  return {
    id: String(e.id || ('w-' + String(e.title || 'entry').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'w' + uid())).slice(0, 80),
    title: String(e.title || 'Untitled').slice(0, 120), cat: WIKI_CATS.includes(e.cat) ? e.cat : 'Lore',
    tags: list(e.tags), aliases: list(e.aliases),
    summary: String(e.summary || ''), audience: String(e.audience || ''), body: String(e.body || ''),
    asset: e.asset || null, at: Number(e.at) || Date.now(),
  };
}
const wFind = (id) => G.W.entries.find((e) => e.id === id);
function wByName(name) {
  const n = String(name || '').trim().toLowerCase();
  return G.W.entries.find((e) => e.title.toLowerCase() === n) || G.W.entries.find((e) => e.aliases.some((a) => a.toLowerCase() === n));
}
const wPlayerText = (e) => (e.audience || e.summary || '').trim();
const LINK_RE = /\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g;

function wSearch(q, cat) {
  const t = q.trim().toLowerCase();
  const pool = G.W.entries.filter((e) => !cat || e.cat === cat);
  if (!t) return pool.slice().sort((a, b) => a.title.localeCompare(b.title)).map((e) => ({ e, snip: e.summary }));
  const out = [];
  for (const e of pool) {
    let score = 0;
    const tl = e.title.toLowerCase();
    if (tl === t) score += 100; else if (tl.startsWith(t)) score += 60; else if (tl.includes(t)) score += 40;
    if (e.aliases.some((a) => a.toLowerCase().includes(t))) score += 35;
    if (e.tags.some((g) => g.toLowerCase().includes(t))) score += 20;
    const hay = [e.summary, e.audience, e.body].join('\n');
    const at = hay.toLowerCase().indexOf(t);
    if (at >= 0) score += 10;
    if (!score) continue;
    let snip = e.summary;
    if (at >= 0 && !tl.includes(t)) {
      const a = Math.max(0, at - 50), b = Math.min(hay.length, at + t.length + 70);
      snip = (a ? '…' : '') + hay.slice(a, b).replace(LINK_RE, (_, x, y) => y || x).replace(/\s+/g, ' ') + (b < hay.length ? '…' : '');
    }
    out.push({ e, snip, score });
  }
  return out.sort((a, b) => b.score - a.score || a.e.title.localeCompare(b.e.title));
}
function wBacklinks(e) {
  const names = [e.title, ...e.aliases].map((x) => x.toLowerCase());
  return G.W.entries.filter((o) => o !== e && [...o.body.matchAll(LINK_RE)].some((m) => names.includes(m[1].trim().toLowerCase())));
}

/* Notes markup: blank line = new paragraph, "- " = bullet, [[Name]] or [[Name|shown text]] = link, "GM:" = GM-only marker. */
function wInline(text, onLink) {
  const out = []; let last = 0;
  for (const m of text.matchAll(LINK_RE)) {
    if (m.index > last) out.push(text.slice(last, m.index));
    const target = m[1].trim(), found = wByName(target);
    out.push(h('button', { class: 'wlink' + (found ? '' : ' missing'), title: found ? `Open ${found.title}` : `No entry for “${target}” yet. Click to start one.`, onclick: () => onLink(target, found) }, (m[2] || m[1]).trim()));
    last = m.index + m[0].length;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
function wBodyEl(body, onLink) {
  const box = h('div', { class: 'wbody' });
  for (const block of body.replace(/\r/g, '').split(/\n\s*\n/)) {
    const lines = block.split('\n').filter((l) => l.trim());
    if (!lines.length) continue;
    if (lines.every((l) => /^\s*[-*]\s+/.test(l))) {
      box.append(h('ul', null, lines.map((l) => h('li', null, wInline(l.replace(/^\s*[-*]\s+/, ''), onLink)))));
      continue;
    }
    const txt = lines.join(' ');
    const gm = /^GM:\s*/i.test(txt);
    box.append(h('p', { class: gm ? 'gm-note' : null }, gm ? h('b', null, 'GM: ') : null, wInline(txt.replace(/^GM:\s*/i, ''), onLink)));
  }
  return box;
}

/* ---------- UI state and navigation ---------- */
function wv() { return (G.wiki = G.wiki || { q: '', cat: '', id: null, hist: [], draft: null }); }
function wRerender() { (G.wikiWindow ? renderWikiWindow : renderGM)(); }
function wOpen(id) {
  const v = wv();
  if (v.id && v.id !== id) v.hist.push(v.id);
  v.id = id; v.draft = null; wRerender();
  const main = document.querySelector('.wiki-main'); if (main) main.scrollTop = 0;
}
function wStartDraft(e, title) {
  const v = wv();
  v.draft = e ? { ...clone(e), isNew: false } : { ...wikiNorm({ title: title || '', cat: v.cat || 'People' }), title: title || '', isNew: true };
  wRerender();
}
const wLink = (target, found) => (found ? wOpen(found.id) : wStartDraft(null, target));

/* ---------- showing an entry to players ---------- */
async function applyWikiShow(show) {
  const S = G.S;
  if (show.asset && !AssetStore.mem.has(show.asset)) await AssetStore.get(show.asset); // a picture added in the pop-out window
  S.wikiShow = { ...show, at: Date.now() };
  if (show.library) {
    S.handouts.unshift({ id: 'h' + uid(), kind: 'text', title: show.title, asset: show.asset || null, body: show.text, share: { all: !!show.all, to: show.all ? [] : [...show.to] }, at: Date.now(), sharedAt: Date.now() });
  }
  delete S.wikiShow.library;
  commit();
}
function hideWikiShow() {
  if (G.wikiWindow) { LS.set('hdoc.gm.wikiReq', { hide: true, n: uid() }); return; }
  G.S.wikiShow = null; commit();
}
async function wShowDialog(e) {
  const S = G.S || { roster: [] };
  const roster = (S.roster || []).filter((r) => r.active);
  const text = wPlayerText(e);
  const res = await modal((box, close) => {
    let all = true; const to = new Set(); let library = false;
    const draw = () => {
      box.replaceChildren(h('h3', null, `Show “${e.title}”`),
        h('p', { class: 'hint' }, 'Players see the card below and nothing else from this entry. Your notes stay here.'),
        h('div', { class: 'wcard-prev' }, h('div', { class: 'eyebrow' }, e.cat), h('b', null, e.title),
          e.asset && AssetStore.url(e.asset) ? h('img', { src: AssetStore.url(e.asset), alt: '' }) : null,
          text ? h('p', null, text) : h('p', { class: 'muted' }, 'This entry has no player-safe text yet, so only its title and picture will show.')),
        h('span', { class: 'ctl-label' }, 'Show to'),
        h('div', { class: 'shareto' },
          h('label', { class: 'chipcheck' + (all ? ' on' : '') }, h('input', { type: 'checkbox', checked: all, onchange: (ev) => { all = ev.target.checked; draw(); } }), 'Everyone, and the table display'),
          all ? null : roster.map((r) => h('label', { class: 'chipcheck' + (to.has(r.id) ? ' on' : '') },
            h('input', { type: 'checkbox', checked: to.has(r.id), onchange: (ev) => { ev.target.checked ? to.add(r.id) : to.delete(r.id); draw(); } }), faceEl(r), r.name))),
        h('label', { class: 'row', style: { gap: '8px', marginTop: '10px' } }, h('input', { type: 'checkbox', checked: library, onchange: (ev) => { library = ev.target.checked; } }), 'Also add it to their Library as a handout'),
        h('div', { class: 'row end' }, h('button', { class: 'btn ghost', onclick: () => close(null) }, 'Cancel'),
          h('button', { class: 'btn primary', disabled: !all && !to.size, onclick: () => close({ all, to: [...to], library }) }, 'Show it')));
    };
    draw();
  });
  if (!res) return;
  const show = { id: e.id, title: e.title, cat: e.cat, text, asset: e.asset || null, all: res.all, to: res.to, library: res.library };
  if (G.wikiWindow) { LS.set('hdoc.gm.wikiReq', { show, n: uid() }); toast('Sent to the console.'); }
  else applyWikiShow(show);
}

/* ---------- import / export ---------- */
async function wExport() {
  const ids = new Set(G.W.entries.map((e) => e.asset).filter(Boolean));
  const assets = (await AssetStore.all()).filter((a) => ids.has(a.id));
  const blob = new Blob([JSON.stringify({ app: 'helianthus-gm-pack', exported: Date.now(), entries: G.W.entries, assets })], { type: 'application/json' });
  const a = h('a', { href: URL.createObjectURL(blob), download: `helianthus-wiki-${new Date().toISOString().slice(0, 10)}.json` });
  document.body.append(a); a.click(); a.remove();
}
/* A GM pack can hold wiki entries, their pictures, and GM versions of built-in maps. */
async function importGMPack() {
  const [f] = await pickFile('application/json,.json'); if (!f) return;
  let data; try { data = JSON.parse(await f.text()); } catch { toast('That file isn’t a wiki file or GM pack.'); return; }
  if (data.app !== 'helianthus-gm-pack' || !Array.isArray(data.entries)) { toast('That file isn’t a wiki file or GM pack.'); return; }
  for (const a of data.assets || []) if (a && a.id && a.data) await AssetStore.put(a);
  const incoming = data.entries.map(wikiNorm);
  const clash = incoming.filter((e) => wFind(e.id));
  let replace = false;
  if (clash.length) replace = await ask(`${clash.length} of these entries are already in your wiki`, 'Replace your versions with the ones in the file, or keep yours and add only the new entries?', 'Replace mine');
  let added = 0, replaced = 0;
  for (const e of incoming) {
    const i = G.W.entries.findIndex((x) => x.id === e.id);
    if (i < 0) { G.W.entries.push(e); added++; } else if (replace) { G.W.entries[i] = e; replaced++; }
  }
  wikiSave();
  let layers = 0;
  if (!G.wikiWindow && Array.isArray(data.mapLayers)) {
    const S = G.S;
    const allMaps = [...S.maps, ...S.scenarios.flatMap((sc) => sc.maps || [])];
    for (const l of data.mapLayers) { const m = allMaps.find((x) => x.id === l.map); if (m && l.gmAsset) { m.gmAsset = l.gmAsset; layers++; } }
    if (layers) saveGM();
  }
  toast([added && `${added} entries added`, replaced && `${replaced} replaced`, layers && `${layers} GM map${layers > 1 ? 's' : ''} attached`].filter(Boolean).join(', ') || 'Nothing new in that file.', 4000);
  wRerender();
}

/* ---------- the section ---------- */
function wResults() {
  const v = wv();
  const res = wSearch(v.q, v.cat);
  return res.length ? res.map(({ e, snip }) => h('button', { class: 'wres-item' + (e.id === v.id ? ' cur' : ''), onclick: () => { v.hist = []; wOpen(e.id); } },
    h('span', { class: 'wres-t' }, e.title, h('span', { class: 'wres-c' }, e.cat)), snip ? h('span', { class: 'wres-s' }, snip) : null))
    : [h('p', { class: 'empty' }, v.q ? `Nothing matches “${v.q}”.` : 'No entries yet.'),
      v.q ? h('button', { class: 'btn small', onclick: () => wStartDraft(null, v.q) }, `Start “${v.q}”`) : null];
}
function secWiki() {
  const v = wv();
  if (v.id && !wFind(v.id)) v.id = null;
  const search = h('input', { type: 'search', class: 'wq', 'data-keep': 'wiki-q', placeholder: `Search ${G.W.entries.length} entries`, 'aria-label': 'Search the wiki', value: v.q });
  const results = h('div', { class: 'wres' }, wResults());
  search.addEventListener('input', () => { v.q = search.value; results.replaceChildren(...wResults().filter(Boolean)); });
  search.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { const r = wSearch(v.q, v.cat)[0]; if (r) { ev.preventDefault(); v.hist = []; wOpen(r.e.id); } }
    if (ev.key === 'Escape') { v.q = ''; search.value = ''; results.replaceChildren(...wResults().filter(Boolean)); }
  });
  const counts = Object.fromEntries(WIKI_CATS.map((c) => [c, G.W.entries.filter((e) => e.cat === c).length]));
  const cats = h('div', { class: 'wcats' },
    h('button', { class: 'btn small' + (!v.cat ? ' on' : ''), onclick: () => { v.cat = ''; wRerender(); } }, 'All'),
    WIKI_CATS.filter((c) => counts[c]).map((c) => h('button', { class: 'btn small' + (v.cat === c ? ' on' : ''), onclick: () => { v.cat = v.cat === c ? '' : c; wRerender(); } }, c)));
  const side = h('div', { class: 'wiki-side' }, search, cats, results);
  const main = h('div', { class: 'wiki-main' }, v.draft ? wEditor() : v.id ? wEntry(wFind(v.id)) : wWelcome());
  const tools = h('div', { class: 'toolbar' },
    h('button', { class: 'btn small primary', onclick: () => wStartDraft(null, '') }, 'New entry'),
    h('button', { class: 'btn small', onclick: importGMPack }, 'Import…'),
    h('button', { class: 'btn small', onclick: wExport, disabled: !G.W.entries.length }, 'Export all'),
    G.wikiWindow ? null : h('button', { class: 'btn small ghost', title: 'Open the wiki in its own window, for a second screen', onclick: () => window.open(location.pathname + location.search + '#wiki', 'helianthus-wiki', 'width=1100,height=850') }, 'Pop out'));
  return h('div', null,
    G.wikiWindow ? null : secHead('Wiki', null, 'Your reference. Only you see it. Showing an entry sends players just its player-safe text and picture.'),
    tools, h('div', { class: 'wiki' }, side, main));
}
function wWelcome() {
  const n = G.W.entries.length;
  return h('div', { class: 'wwelcome' },
    h('h3', null, n ? 'Pick an entry, or search' : 'The wiki is empty'),
    h('p', { class: 'hint' }, n ? 'Type to search names, other names, tags and notes. Enter opens the top result.' : 'Import your GM pack, or start an entry of your own.'),
    n ? null : h('div', null, h('button', { class: 'btn primary', onclick: importGMPack }, 'Import GM pack')));
}
function wEntry(e) {
  const v = wv();
  const back = v.hist.length ? h('button', { class: 'btn small ghost', onclick: () => { v.id = v.hist.pop(); wRerender(); } }, '‹ Back') : null;
  const img = e.asset && AssetStore.url(e.asset);
  const pt = wPlayerText(e);
  const showing = G.S && G.S.wikiShow && G.S.wikiShow.id === e.id;
  const backs = wBacklinks(e);
  return h('article', { class: 'wentry' },
    h('div', { class: 'row', style: { justifyContent: 'space-between' } }, back || h('span'),
      h('div', { class: 'row', style: { gap: '6px' } },
        showing ? h('button', { class: 'btn small', onclick: hideWikiShow }, 'Take it down') : h('button', { class: 'btn small primary', onclick: () => wShowDialog(e) }, 'Show to players'),
        h('button', { class: 'btn small', onclick: () => wStartDraft(e) }, 'Edit'))),
    h('div', { class: 'eyebrow' }, e.cat, e.tags.length ? ' · ' + e.tags.join(', ') : ''),
    h('h2', { class: 'wtitle' }, e.title),
    e.aliases.filter((x) => x.toLowerCase() !== e.title.toLowerCase()).length ? h('div', { class: 'small-text muted' }, 'Also: ', e.aliases.filter((x) => x.toLowerCase() !== e.title.toLowerCase()).join(', ')) : null,
    img ? h('img', { class: 'wimg', src: img, alt: '' }) : null,
    h('div', { class: 'wplayer' }, h('div', { class: 'ctl-label' }, e.audience ? 'What players see' : 'Summary (what players see)'),
      pt ? h('p', null, pt) : h('p', { class: 'muted' }, 'Nothing written for players yet.')),
    e.body ? wBodyEl(e.body, wLink) : null,
    backs.length ? h('div', { class: 'wbacks' }, h('span', { class: 'ctl-label' }, 'Mentioned in'),
      h('div', { class: 'row', style: { gap: '6px' } }, backs.map((o) => h('button', { class: 'wlink', onclick: () => wOpen(o.id) }, o.title)))) : null);
}
function wEditor() {
  const v = wv(), d = v.draft;
  const field = (label, el, hint) => h('label', { class: 'field' }, h('span', null, label), el, hint ? h('span', { class: 'small-text muted' }, hint) : null);
  const inp = (k, attrs = {}) => { const el = h('input', { type: 'text', value: Array.isArray(d[k]) ? d[k].join(', ') : d[k], ...attrs }); el.addEventListener('input', () => { d[k] = Array.isArray(d[k]) ? el.value.split(',').map((x) => x.trim()).filter(Boolean) : el.value; }); return el; };
  const area = (k, rows, ph) => { const el = h('textarea', { rows: String(rows), placeholder: ph || '' }); el.value = d[k]; el.addEventListener('input', () => { d[k] = el.value; }); return el; };
  const save = () => {
    const title = (d.title || '').trim();
    if (!title) { toast('Give the entry a title first.'); return; }
    const other = G.W.entries.find((x) => x.title.toLowerCase() === title.toLowerCase() && x.id !== d.id);
    if (other && (d.isNew || other.id !== d.id)) { toast(`There’s already an entry called “${other.title}”.`); return; }
    const e = wikiNorm({ ...d, title, at: Date.now(), id: d.isNew ? undefined : d.id });
    if (d.isNew) { let id = e.id, n = 2; while (wFind(id)) id = e.id + '-' + n++; e.id = id; G.W.entries.push(e); }
    else G.W.entries[G.W.entries.findIndex((x) => x.id === d.id)] = e;
    wikiSave(); v.draft = null; v.id = e.id; wRerender();
  };
  return h('div', { class: 'wedit stack' },
    h('h3', null, d.isNew ? 'New entry' : `Editing ${d.title}`),
    h('div', { class: 'grid2' }, field('Title', inp('title', { autofocus: true })),
      field('Category', h('select', { onchange: (ev) => { d.cat = ev.target.value; } }, WIKI_CATS.map((c) => h('option', { value: c, selected: d.cat === c }, c))))),
    h('div', { class: 'grid2' }, field('Other names', inp('aliases'), 'Separate with commas'), field('Tags', inp('tags'), 'Separate with commas')),
    field('Summary', area('summary', 3, 'What the party already knows. Safe to show.'), 'Shown to players when you show this entry, unless you write separate text below.'),
    field('What players see (optional)', area('audience', 3, 'Leave empty to use the summary.')),
    field('Notes (you only)', area('body', 12, 'Blank line = new paragraph. "- " = bullet. [[Name]] links to an entry. Start a paragraph with GM: to mark a secret.')),
    imageSlot('Picture', d.asset, (id) => { d.asset = id; wRerender(); }, 1400),
    h('div', { class: 'row', style: { justifyContent: 'space-between' } },
      d.isNew ? h('span') : h('button', { class: 'btn small danger', onclick: async () => {
        if (!(await ask(`Delete “${d.title}”?`, 'It’s removed from the wiki. Links to it will show as missing.', 'Delete', true))) return;
        G.W.entries = G.W.entries.filter((x) => x.id !== d.id); wikiSave(); v.draft = null; v.id = null; wRerender();
      } }, 'Delete entry'),
      h('div', { class: 'row', style: { gap: '6px' } }, h('button', { class: 'btn ghost', onclick: () => { v.draft = null; wRerender(); } }, 'Cancel'), h('button', { class: 'btn primary', onclick: save }, 'Save'))));
}

/* ---------- the pop-out window (#wiki): the wiki on its own, no room hosting ---------- */
async function startWikiWindow() {
  G.wikiWindow = true;
  await AssetStore.all();
  G.S = LS.get('hdoc.gm.state', null);
  if (G.S) applyTheme(G.S.theme);
  wikiLoad();
  document.title = 'Wiki — ' + ((G.S && G.S.title) || APP.name);
  window.addEventListener('storage', (e) => {
    if (e.key === WIKI_KEY && !wv().draft && !typing()) { wikiLoad(); renderWikiWindow(); }
    if (e.key === 'hdoc.gm.state') { G.S = LS.get('hdoc.gm.state', null); if (!typing()) renderWikiWindow(); }
  });
  renderWikiWindow();
}
function renderWikiWindow() {
  keepFocus(() => appRoot().replaceChildren(h('div', { class: 'wiki-window' },
    h('header', { class: 'row', style: { justifyContent: 'space-between' } }, h('h1', null, 'Wiki'),
      G.S && G.S.wikiShow ? h('span', { class: 'showing' }, 'Showing: ', h('b', null, G.S.wikiShow.title), h('button', { class: 'btn small ghost', onclick: hideWikiShow }, '✕')) : null),
    secWiki())));
}


/* ============================================================
   Boot: #gm opens the console, #table the table display,
   anything else the player view.
   ============================================================ */
(function boot() {
  const hash = location.hash.replace('#', '').toLowerCase();
  if (typeof Peer === 'undefined') {
    appRoot().replaceChildren(h('div', { class: 'join' }, h('h1', null, 'Couldn’t start'), h('p', { class: 'hint' }, 'The connection library failed to load. Reload the page.')));
    return;
  }
  window.addEventListener('hashchange', () => location.reload());
  if (hash === 'gm') startGM();
  else if (hash === 'wiki') startWikiWindow();
  else startViewer(hash === 'table' ? 'table' : 'player');
})();
