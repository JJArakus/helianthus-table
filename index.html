<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16272A">
<title>Helianthus Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=Cormorant+Garamond:wght@500;600&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* ============================================================
   Helianthus Table — styles
   Theme tokens are set on :root by applyTheme(); these are the
   Wartable defaults so the page renders before the theme loads.
   ============================================================ */
:root{
  --bg:#16272A; --panel:#1F3438; --panel-2:#284044; --line:#354C50;
  --ink:#ECE4CF; --muted:#A3B1AA; --accent:#E3A94B; --accent-ink:#1B1A14;
  --fear:#C0503F; --fear-deep:#2B1630; --hope:#8CC0A8; --danger:#D86A5A;
  --font-display:"Marcellus", Georgia, serif;
  --font-body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  --bg-image:none; --bg-dim:.82;
  --radius:10px; --radius-s:6px;
  --shadow:0 10px 30px rgba(0,0,0,.28);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background-color:var(--bg); color:var(--ink);
  font:17px/1.45 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:var(--bg-image) center/cover no-repeat;
  opacity:calc(1 - var(--bg-dim));
}
h1,h2,h3,h4{font-family:var(--font-display); font-weight:400; margin:0; line-height:1.15}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
[hidden]{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- controls ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  min-height:36px; padding:6px 14px; border-radius:var(--radius-s);
  border:1px solid var(--line); background:var(--panel-2); cursor:pointer;
  line-height:1.1; white-space:nowrap;
}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45; cursor:default; border-color:var(--line)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:500}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}
.btn.small{min-height:30px; padding:3px 10px; font-size:15px}
.icon-btn{
  width:34px; height:34px; min-height:0; padding:0; border-radius:50%;
  font-size:18px; line-height:1;
}
.stepper{display:inline-flex; align-items:center; gap:4px}
.stepper .val{min-width:3.4em; text-align:center; font-variant-numeric:tabular-nums}
.field{display:flex; flex-direction:column; gap:4px; font-size:15px; color:var(--muted)}
.field > span{color:var(--muted)}
input[type=text],input[type=number],input:not([type]),select,textarea{
  background:color-mix(in srgb, var(--bg) 70%, var(--panel));
  border:1px solid var(--line); border-radius:var(--radius-s);
  padding:7px 10px; color:var(--ink); min-width:0;
}
textarea{resize:vertical; min-height:80px; line-height:1.45}
input[type=color]{width:42px; height:34px; padding:2px; border:1px solid var(--line); border-radius:var(--radius-s); background:transparent}
input[type=range]{accent-color:var(--accent)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.end{justify-content:flex-end}
.grow{flex:1 1 auto}
.muted{color:var(--muted)}
.small-text{font-size:14px}
.hint{color:var(--muted); font-size:15px; margin:0}

/* switch */
.switch{position:relative; display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:15px; color:var(--muted)}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .track{
  width:36px; height:20px; border-radius:20px; background:var(--line);
  position:relative; transition:background .15s; flex:none;
}
.switch .track::after{
  content:""; position:absolute; top:3px; left:3px; width:14px; height:14px;
  border-radius:50%; background:var(--ink); transition:transform .15s;
}
.switch input:checked + .track{background:var(--accent)}
.switch input:checked + .track::after{transform:translateX(16px); background:var(--accent-ink)}
.switch input:focus-visible + .track{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- toasts & modals ---------- */
#toasts{position:fixed; left:50%; bottom:24px; transform:translateX(-50%); display:flex; flex-direction:column; gap:8px; z-index:200; pointer-events:none}
.toast{background:var(--panel-2); border:1px solid var(--line); border-left:3px solid var(--accent); padding:9px 14px; border-radius:var(--radius-s); box-shadow:var(--shadow); font-size:15px}
.modal-back{position:fixed; inset:0; background:rgba(5,8,10,.66); display:grid; place-items:center; z-index:150; padding:16px}
.modal{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); width:min(520px,100%); max-height:90vh; overflow:auto; padding:22px}
.modal h3{font-size:24px; margin-bottom:10px}
.modal .row.end{margin-top:18px}

/* ============================================================
   FEAR — the one loud element
   ============================================================ */
.fear{display:flex; align-items:center; gap:14px}
.fear-count{font-family:var(--font-display); font-size:30px; line-height:1; min-width:2.2ch; text-align:right; font-variant-numeric:tabular-nums}
.fear-label{font-family:var(--font-display); font-size:18px; color:var(--muted)}
.fear-track{display:flex; flex-wrap:wrap; gap:6px}
.fear-pip{
  --d:22px; width:var(--d); height:var(--d); border-radius:50%; flex:none;
  border:1.5px solid color-mix(in srgb, var(--fear) 45%, var(--line));
  background:color-mix(in srgb, var(--fear) 8%, transparent);
  position:relative; overflow:hidden;
}
.fear-pip.on{
  border-color:var(--fear);
  background:
    conic-gradient(from 40deg, var(--fear-deep), color-mix(in srgb,var(--fear) 55%, var(--fear-deep)) 25%, var(--fear-deep) 50%, color-mix(in srgb,var(--fear) 40%, var(--fear-deep)) 75%, var(--fear-deep));
  box-shadow:0 0 10px color-mix(in srgb, var(--fear) 55%, transparent), inset 0 0 6px rgba(0,0,0,.6);
}
.fear-pip.on::after{content:""; position:absolute; inset:28%; border-radius:50%; background:radial-gradient(circle, #000 0 45%, transparent 70%)}
.fear-pip.img{background-size:cover; background-position:center; border-color:transparent; filter:grayscale(1); opacity:.28}
.fear-pip.img.on{filter:none; opacity:1; box-shadow:0 0 10px color-mix(in srgb, var(--fear) 55%, transparent)}
.fear-pip.img.on::after{display:none}
.fear-pip.pulse{animation:fearIn .7s ease-out}
@keyframes fearIn{0%{transform:scale(.4)} 60%{transform:scale(1.25)} 100%{transform:scale(1)}}
.fear.big .fear-pip{--d:clamp(28px,3.4vw,52px)}
.v-head .fear{flex-wrap:wrap}
.fear.big .fear-count{font-size:clamp(40px,5vw,72px)}
.fear.big .fear-label{font-size:clamp(20px,2vw,30px)}

/* ============================================================
   CLOCKS
   ============================================================ */
.clocks{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:22px 18px}
.clock{display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center}
.clock .c-name{font-family:var(--font-display); font-size:19px; line-height:1.2}
.clock .c-meta{font-size:14px; color:var(--muted); font-variant-numeric:tabular-nums}
.clock svg{display:block; width:var(--clock-d,120px); height:var(--clock-d,120px); overflow:visible}
.clock.wide{grid-column:1/-1; align-items:stretch; text-align:left}
.clock.wide .c-head{display:flex; justify-content:space-between; align-items:baseline; gap:12px}
.bar-track{display:flex; gap:3px; height:26px}
.bar-cell{flex:1; border-radius:3px; background:var(--panel-2); border:1px solid var(--line)}
.bar-cell.on{background:var(--clock-color,var(--accent)); border-color:var(--clock-color,var(--accent))}
.bar-cell.floor{background:repeating-linear-gradient(135deg, var(--line) 0 4px, transparent 4px 8px); border-color:var(--line)}
.bar-cell.floor.on{background:repeating-linear-gradient(135deg, color-mix(in srgb,var(--clock-color,var(--accent)) 75%, #000) 0 4px, var(--clock-color,var(--accent)) 4px 8px)}
.tug-ends{display:flex; justify-content:space-between; font-size:14px; color:var(--muted); margin-top:4px}
.tug-nums{display:flex; gap:16px; font-size:14px; color:var(--muted)}
.tug-nums b{color:var(--ink); font-weight:500; font-variant-numeric:tabular-nums}
.clock-img{width:100%; max-width:260px; aspect-ratio:16/9; object-fit:cover; border-radius:var(--radius-s); border:1px solid var(--line)}

/* ============================================================
   PARTY GROUPS
   ============================================================ */
.groups{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
.group{
  border:1px solid var(--line); border-radius:var(--radius);
  background:color-mix(in srgb, var(--panel) 88%, transparent); padding:14px 14px 12px;
  display:flex; flex-direction:column; gap:10px; position:relative;
}
.group.spot{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent), 0 0 28px color-mix(in srgb, var(--accent) 22%, transparent)}
.group.mine{background:color-mix(in srgb, var(--panel-2) 90%, transparent)}
.group .g-name{font-family:var(--font-display); font-size:20px}
.group .g-loc{color:var(--muted); font-size:15px}
.group .g-tag{font-size:13px; color:var(--accent)}
.group .g-brief{border-left:2px solid var(--accent); padding:4px 0 4px 10px; font-size:15px; white-space:pre-wrap}
.members{display:flex; flex-wrap:wrap; gap:8px; min-height:44px; align-content:flex-start}
.member{display:inline-flex; align-items:center; gap:7px; padding:3px 10px 3px 3px; border-radius:30px; background:var(--panel-2); border:1px solid var(--line); font-size:15px; user-select:none}
.member.me{border-color:var(--accent)}
.face{
  width:32px; height:32px; border-radius:50%; flex:none; display:grid; place-items:center;
  background:var(--c,#777); color:#111; font-family:var(--font-display); font-size:15px;
  background-size:cover; background-position:center; border:2px solid var(--c,#777);
}
.hope-pips{display:inline-flex; gap:2px; margin-left:2px}
.hope-pips i{width:7px; height:7px; border-radius:50%; border:1px solid var(--hope); display:block}
.hope-pips i.on{background:var(--hope)}

/* ============================================================
   MAP
   ============================================================ */
.mapbox{position:relative; width:100%; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:
  radial-gradient(ellipse at 30% 20%, color-mix(in srgb,var(--panel-2) 70%, transparent), transparent 60%), var(--panel); touch-action:none}
.mapbox img.mapimg{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; user-select:none; -webkit-user-drag:none}
.mapgrid{position:absolute; inset:0; pointer-events:none; background-image:
  linear-gradient(to right, color-mix(in srgb,var(--ink) 16%, transparent) 1px, transparent 1px),
  linear-gradient(to bottom, color-mix(in srgb,var(--ink) 16%, transparent) 1px, transparent 1px);}
.tok{position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none}
.tok .face{width:var(--ts,38px); height:var(--ts,38px); font-size:calc(var(--ts,38px)*.42); box-shadow:0 2px 6px rgba(0,0,0,.5)}
.tok .lbl{font-size:12px; background:rgba(0,0,0,.6); color:#fff; padding:0 6px; border-radius:8px; white-space:nowrap}
.tok.ghost{opacity:.4}
.mapbox.edit .tok{pointer-events:auto; cursor:grab}
.mapbox.edit .tok:active{cursor:grabbing}
.map-title{font-family:var(--font-display); font-size:20px; margin-bottom:8px}

/* ============================================================
   VIEWER (player + table)
   ============================================================ */
.viewer{min-height:100%; display:flex; flex-direction:column}
.v-head{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); padding:10px 16px}
.v-head .v-title{display:flex; align-items:center; gap:10px; justify-content:space-between}
.v-title h1{font-size:22px}
.v-title .sub{color:var(--muted); font-size:14px}
.v-banner{max-height:64px; max-width:70%; object-fit:contain}
.v-head .fear{margin-top:8px}
.status{display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap}
.status i{width:8px; height:8px; border-radius:50%; background:var(--muted)}
.status.live i{background:var(--hope)}
.status.wait i{background:var(--accent); animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.v-body{flex:1; padding:18px 16px 96px; max-width:1100px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:28px}
.v-sec h2{font-size:22px; margin-bottom:12px}
.empty{color:var(--muted); font-size:15px; padding:6px 0}
.tabs{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1; background:none; border:0; padding:11px 4px 12px; color:var(--muted); cursor:pointer; position:relative; font-size:15px}
.tabs button[aria-current=page]{color:var(--ink); box-shadow:inset 0 2px 0 var(--accent)}
.tabs .badge{position:absolute; top:6px; margin-left:4px; min-width:18px; height:18px; padding:0 5px; border-radius:9px; background:var(--fear); color:#fff; font-size:12px; line-height:18px}
.lib{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px}
.lib-item{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column}
.lib-item:hover{border-color:var(--accent)}
.lib-item .thumb{aspect-ratio:4/3; background:var(--panel-2) center/cover; display:grid; place-items:center; color:var(--muted); font-family:var(--font-display); font-size:30px}
.lib-item .t{padding:8px 10px; font-size:15px}
.msg{border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; background:var(--panel)}
.msg.unread{border-color:var(--accent)}
.msg .when{font-size:13px; color:var(--muted); margin-bottom:4px}
.msg .txt{white-space:pre-wrap}
.notes{display:grid; grid-template-columns:200px 1fr; gap:14px; min-height:60vh}
.notes .pages{display:flex; flex-direction:column; gap:6px}
.notes .pages button{text-align:left; background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-s); padding:8px 10px; cursor:pointer}
.notes .pages button[aria-current=true]{border-color:var(--accent)}
.notes .editor{display:flex; flex-direction:column; gap:8px}
.notes .editor input{font-family:var(--font-display); font-size:20px}
.notes .editor textarea{flex:1; min-height:50vh; font-size:17px}
.save-state{font-size:13px; color:var(--muted)}
@media (max-width:640px){
  .notes{grid-template-columns:1fr}
  .notes .pages{flex-direction:row; overflow-x:auto}
  .notes .pages button{flex:none}
  .v-head .fear{gap:4px 10px}
  .v-head .fear-track{flex-basis:100%; gap:5px}
  .fear-pip{--d:22px}
  .fear-count{font-size:26px}
  .clocks{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .clock svg{--clock-d:104px}
}

/* reveal overlay */
.reveal{position:fixed; inset:0; z-index:120; background:rgba(4,6,8,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px; gap:14px; animation:fadeIn .35s ease-out}
@keyframes fadeIn{from{opacity:0}}
.reveal img{max-width:100%; max-height:76vh; object-fit:contain; border-radius:var(--radius-s); box-shadow:var(--shadow)}
.reveal h2{font-size:28px; text-align:center; color:#f2ecdc}
.reveal .body{max-width:68ch; color:#e9e2cf; white-space:pre-wrap; overflow:auto; max-height:60vh; font-size:18px; line-height:1.55}
.reveal .btn{min-width:120px}

/* join screen */
.join{max-width:460px; margin:8vh auto; padding:24px; display:flex; flex-direction:column; gap:18px}
.join h1{font-size:34px}
.join .code-in{font-family:var(--font-display); font-size:30px; letter-spacing:.18em; text-transform:uppercase; text-align:center; padding:10px}
.pick{display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px}
.pick button{display:flex; align-items:center; gap:10px; padding:10px; border-radius:var(--radius); border:1px solid var(--line); background:var(--panel); cursor:pointer; text-align:left}
.pick button:hover{border-color:var(--accent)}

/* table display */
.table-mode .v-body{max-width:none; padding:24px 32px 32px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:32px; align-items:start}
.table-mode .v-head{position:static}
.table-mode .clock svg{--clock-d:170px}
.table-mode .clock .c-name{font-size:24px}
.table-mode .group .g-name{font-size:26px}
.table-mode .v-sec h2{font-size:28px}
.table-mode .tok .face{width:calc(var(--ts,38px)*1.6); height:calc(var(--ts,38px)*1.6); font-size:calc(var(--ts,38px)*.66)}
.table-mode .tok .lbl{font-size:17px}
@media (max-width:900px){.table-mode .v-body{grid-template-columns:1fr}}

/* ============================================================
   GM CONSOLE
   ============================================================ */
.gm{display:grid; grid-template-columns:230px minmax(0,1fr); grid-template-rows:auto 1fr; min-height:100vh}
.gm-top{grid-column:1/-1; display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:10px 18px; border-bottom:1px solid var(--line); background:color-mix(in srgb, var(--bg) 94%, transparent); position:sticky; top:0; z-index:40}
.gm-top h1{font-size:20px; white-space:nowrap}
.roomcode{display:flex; align-items:center; gap:8px; padding:4px 6px 4px 12px; border:1px solid var(--line); border-radius:var(--radius-s)}
.roomcode b{font-family:var(--font-display); font-size:22px; letter-spacing:.14em; font-weight:400}
.conns{display:flex; gap:4px; align-items:center; flex-wrap:wrap}
.conns .face{width:26px; height:26px; font-size:12px}
.conns .face.off{opacity:.25; filter:grayscale(1)}
.gm-fear{display:flex; align-items:center; gap:10px; margin-left:auto}
.gm-fear .fear-pip{--d:16px}
.gm-nav{border-right:1px solid var(--line); padding:14px 10px; display:flex; flex-direction:column; gap:2px; position:sticky; top:59px; align-self:start; height:calc(100vh - 59px); overflow:auto}
.gm-nav .navrow{display:flex; align-items:center; gap:6px; border-radius:var(--radius-s)}
.gm-nav .navrow button.nav{flex:1; text-align:left; background:none; border:0; padding:9px 10px; border-radius:var(--radius-s); cursor:pointer; color:var(--muted)}
.gm-nav .navrow button.nav:hover{color:var(--ink)}
.gm-nav .navrow.cur{background:var(--panel)}
.gm-nav .navrow.cur button.nav{color:var(--ink)}
.gm-nav .sep{height:1px; background:var(--line); margin:10px 6px}
.gm-nav .nav-head{font-size:13px; color:var(--muted); padding:6px 10px 2px}
.gm-main{padding:22px 26px 80px; min-width:0}
body.previewing .gm-main{padding-right:440px}
body.previewing .gm-top{padding-right:18px}
.gm-nav select{width:100%}
.gm-main > h2{font-size:28px; margin-bottom:4px}
.gm-main > .hint{margin-bottom:18px}
.sec-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:6px}
.sec-head h2{font-size:28px}
.toolbar{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 18px}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.stack{display:flex; flex-direction:column; gap:14px}
.ed-clock{display:grid; grid-template-columns:170px minmax(0,1fr); gap:18px; align-items:start}
.ed-clock.wide{grid-template-columns:1fr}
.ed-clock.wide .preview{display:block}
.ed-clock.hidden-from-players{opacity:.72}
.ed-clock .preview{display:flex; justify-content:center}
.ed-clock .ctrls{display:flex; flex-direction:column; gap:10px}
.ed-clock .grid2{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:10px}
.ctl-label{font-size:14px; color:var(--muted); margin-right:4px}
.vis-tag{font-size:13px; color:var(--muted)}
.ed-groups{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.ed-group{border:1px dashed var(--line); border-radius:var(--radius); padding:12px; display:flex; flex-direction:column; gap:8px; background:var(--panel)}
.ed-group.drop{border-color:var(--accent); border-style:solid}
.ed-group.spot{border-style:solid; border-color:var(--accent)}
.ed-group .members{min-height:56px; padding:6px; border-radius:var(--radius-s); background:color-mix(in srgb,var(--bg) 60%, var(--panel))}
.ed-group .member{cursor:grab}
.ed-group .member.sel{outline:2px solid var(--accent)}
.map-ed{display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:18px; align-items:start}
.tok-list{display:flex; flex-direction:column; gap:6px; max-height:60vh; overflow:auto}
.tok-row{display:flex; align-items:center; gap:8px; font-size:15px}
.tok-row .face{width:26px; height:26px; font-size:12px}
.ho-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px}
.ho{display:flex; flex-direction:column; gap:8px}
.ho .thumb{aspect-ratio:16/10; border-radius:var(--radius-s); background:var(--panel-2) center/contain no-repeat; border:1px solid var(--line)}
.shareto{display:flex; flex-wrap:wrap; gap:6px}
.chipcheck{display:inline-flex; align-items:center; gap:5px; padding:3px 9px 3px 4px; border:1px solid var(--line); border-radius:20px; font-size:14px; cursor:pointer}
.chipcheck input{margin:0}
.chipcheck.on{border-color:var(--accent)}
.roster-row{display:grid; grid-template-columns:40px minmax(120px,1fr) 52px auto auto auto; gap:10px; align-items:center}
.roster-row .face{width:36px; height:36px}
.preset-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px}
.preset{border:1px solid var(--line); border-radius:var(--radius); padding:10px; cursor:pointer; background:var(--panel); text-align:left}
.preset.cur{border-color:var(--accent)}
.preset .sw{display:flex; gap:3px; margin-top:6px}
.preset .sw i{flex:1; height:16px; border-radius:3px; display:block}
.img-slot{display:flex; align-items:center; gap:10px}
.img-slot .thumb{width:64px; height:44px; border-radius:var(--radius-s); border:1px solid var(--line); background:var(--panel-2) center/cover no-repeat}
.qr{background:#fff; padding:10px; border-radius:var(--radius-s); width:max-content}
.qr svg{display:block; width:160px; height:160px}
.preview-frame{width:390px; max-width:calc(100vw - 64px); height:min(78vh,760px); border:1px solid var(--line); border-radius:22px; overflow:auto; background:var(--bg); position:relative}
.preview-frame .tabs{position:sticky; bottom:0}
@media (max-width:860px){
  .gm{grid-template-columns:1fr}
  .gm-nav{position:static; height:auto; flex-direction:row; flex-wrap:wrap; border-right:0; border-bottom:1px solid var(--line)}
  .gm-nav .sep,.gm-nav .nav-head{display:none}
  .ed-clock{grid-template-columns:1fr}
  .map-ed{grid-template-columns:1fr}
  .gm-main{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}

/* ---------- adversaries (GM only) ---------- */
.adv-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}
.adv{display:flex; flex-direction:column; gap:10px}
.adv.defeated{opacity:.5}
.adv.defeated:hover{opacity:.85}
.adv-name{font-family:var(--font-display); font-size:19px}
.adv-down{font-family:var(--font-display); color:var(--danger); font-size:17px}
.adv-track{display:flex; align-items:center; gap:10px}
.adv-track .ctl-label{width:44px}
.pips{display:flex; flex-wrap:wrap; gap:4px}
.pip{width:22px; height:22px; padding:0; border:1.5px solid var(--line); background:transparent; cursor:pointer; border-radius:4px}
.pips.stress .pip{border-radius:50%}
.pips.hp .pip.on{background:var(--danger); border-color:var(--danger)}
.pips.stress .pip.on{background:var(--accent); border-color:var(--accent)}
.pip:hover{border-color:var(--ink)}
details > summary{cursor:pointer; color:var(--muted); font-size:15px}
details[open] > summary{margin-bottom:8px}
.statblock{display:flex; flex-direction:column; gap:7px; font-size:15px; line-height:1.4}
.statblock p{margin:0}
.sb-desc{font-style:italic; color:var(--muted)}
.sb-line{display:flex; flex-wrap:wrap; gap:4px 16px}
.sb-line b{font-weight:500}
.sb-feat{border-top:1px solid var(--line); padding-top:7px}
.sb-text{margin-top:3px}
.adv-lib{display:flex; flex-direction:column; gap:8px}

</style>
</head>

        var b0 = bin.read();

        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

      }

      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

}

  P.conn = null;

  const peer = new Peer(undefined, peerOptions());
  P.peer = peer;
  peer.on('open', () => {
    if (!live()) return;
    const conn = peer.connect(PEER_PREFIX + P.code, { reliable: true });
    P.conn = conn;
    setTimeout(() => { if (live() && !conn.open) scheduleRetry('Reconnecting'); }, 15000);
    conn.on('open', () => {
      if (!live()) { try { conn.close(); } catch {} return; }
      clearTimeout(P.retryT); P.retryT = null;
      P.retryMs = 1500; P.lastMsg = Date.now(); P.everLive = true;
      setStatus('live', 'Live');
      if (P.who) send({ t: 'join', who: P.who === 'table' ? 'table' : 'char:' + P.who });
      else {
        send({ t: 'hi' });
        // Ask again if the character list hasn't arrived (a dropped first message shouldn't strand anyone).
        const ask = setInterval(() => { if (!live() || P.who || (P.roster && P.roster.length)) clearInterval(ask); else send({ t: 'hi' }); }, 2500);
      }
    });
    conn.on('data', (d) => { if (live()) onDataP(d); });
    conn.on('close', () => { if (live()) scheduleRetry('Reconnecting'); });
    conn.on('error', () => { if (live()) scheduleRetry('Reconnecting'); });
  });
  peer.on('error', (e) => {
    if (!live()) return;
    scheduleRetry(e.type === 'peer-unavailable' ? 'Waiting for the GM' : 'Reconnecting');
  });
  peer.on('disconnected', () => { if (live() && !(P.conn && P.conn.open)) scheduleRetry('Reconnecting'); });
}
/* One pending retry at a time; a fresh connectP() replaces everything from the last attempt. */
function scheduleRetry(text) {
  setStatus('wait', text);
  if (!P.view && !document.querySelector('.pick')) renderWaiting(text);
  if (P.retryT) return;
  P.retryT = setTimeout(connectP, P.retryMs);
  P.retryMs = Math.min(P.retryMs * 1.6, 10000);
}
function send(msg) { try { if (P.conn && P.conn.open) P.conn.send(msg); } catch (e) { console.warn(e); } }

const renderSoon = debounce(() => renderP(), 120);
async function onDataP(msg) {
  if (!msg || typeof msg !== 'object') return;
  P.lastMsg = Date.now();
  if (msg.t === 'ping') { send({ t: 'pong' }); return; }
  if (msg.t === 'hello') {
    P.roster = msg.roster || [];
    requestAssets({ roster: P.roster });
    if (P.role === 'table') return;
    if (!P.who || !P.roster.some((r) => r.id === P.who)) { P.who = null; pickScreen(); }
  } else if (msg.t === 'view') {
    const first = !P.view;
    const prevFear = P.view && P.view.fear ? P.view.fear.value : null;
    P.view = msg.view; LS.set(pKey('view'), P.view);
    if (P.freshDevice && P.view.me) { P.seen.msgs = (P.view.messages || []).map((m) => m.id); saveSeen(); P.freshDevice = false; }
    P.fearPulseFrom = prevFear != null && P.view.fear && P.view.fear.value > prevFear ? prevFear : null;
    applyTheme(P.view.theme);
    await requestAssets(P.view);
    if (P.who && P.who !== 'table' && first) send({ t: 'notes', notebook: P.notebook });
    renderP();
    checkPopups();
  } else if (msg.t === 'asset') {
    if (msg.asset && msg.asset.id) { await AssetStore.put(msg.asset); P.assetWait.delete(msg.asset.id); if (P.view) applyTheme(P.view.theme); renderSoon(); checkPopups(); }
  } else if (msg.t === 'notes') {
    const merged = mergeNotebook(P.notebook, msg.notebook);
    P.notebook = merged; LS.set(pKey('notes.' + P.who), merged);
    if (P.tab === 'notes' && !document.activeElement?.closest?.('.notes')) renderP();
  } else if (msg.t === 'kicked') {
    LS.del(pKey('who')); P.who = null; pickScreen();
  }
}
async function requestAssets(view) {
  const need = [];
  for (const id of collectAssetIds(view)) {
    if (AssetStore.mem.has(id) || P.assetWait.has(id)) continue;
    const a = await AssetStore.get(id);
    if (!a) { need.push(id); P.assetWait.add(id); }
  }
  if (need.length) send({ t: 'need', ids: need });
}

/* ---------- popups: private messages and handout reveals ---------- */
function saveSeen() { LS.set(pKey('seen.' + (P.who || '')), P.seen); }
function checkPopups() {
  const v = P.view; if (!v) return;
  if (v.reveal && v.reveal.at > (P.seen.reveal || 0) && !P.revealOpen) {
    const ho = (v.handouts || []).find((x) => x.id === v.reveal.id);
    if (ho && ho.asset && !AssetStore.mem.has(ho.asset)) return; // wait for the image; checked again when it arrives
    if (ho) {
      P.seen.reveal = v.reveal.at; saveSeen();
      P.revealOpen = true;
      handoutOverlay(ho, () => { P.revealOpen = false; checkPopups(); });
      return;
    }
  }
  if (P.role === 'table' || !v.messages || P.msgOpen || P.revealOpen) return;
  const seen = new Set(P.seen.msgs || []);
  const fresh = v.messages.filter((m) => !seen.has(m.id)).sort((a, b) => a.at - b.at)[0];
  if (fresh) {
    P.msgOpen = true;
    modal((box, close) => {
      box.append(h('h3', null, 'Private message'), h('p', { class: 'small-text muted' }, 'Only you can see this.'),
        h('div', { class: 'msg', style: { marginTop: '10px' } }, h('div', { class: 'txt' }, fresh.text)),
        h('div', { class: 'row end' }, h('button', { class: 'btn primary', onclick: () => close(true) }, 'Got it')));
    }).then(() => {
      P.seen.msgs = [...(P.seen.msgs || []), fresh.id]; saveSeen();
      P.msgOpen = false; renderP(); checkPopups();
    });
  }
}

/* ---------- notes ---------- */
const pushNotes = debounce(() => send({ t: 'notes', notebook: P.notebook }), 700);
function notesPanel() {
  const pages = P.notebook.pages.filter((p) => !p.deleted);
  if (!P.page || !pages.some((p) => p.id === P.page)) P.page = pages[0] ? pages[0].id : null;
  const cur = pages.find((p) => p.id === P.page);
  const saveState = h('span', { class: 'save-state' }, 'Saved on this device and backed up to the GM');
  const touch = (p) => {
    p.at = Date.now();
    LS.set(pKey('notes.' + P.who), P.notebook);
    saveState.textContent = 'Saving…';
    pushNotes();
    setTimeout(() => { saveState.textContent = 'Saved on this device and backed up to the GM'; }, 900);
  };
  const addPage = () => {
    const p = { id: 'n' + uid(), title: 'New page', body: '', created: Date.now(), at: Date.now() };
    P.notebook.pages.push(p); P.page = p.id; touch(p); renderP();
  };
  const list = h('div', { class: 'pages' },
    pages.map((p) => h('button', { 'aria-current': p.id === P.page ? 'true' : 'false', onclick: () => { P.page = p.id; renderP(); } }, p.title || 'Untitled')),
    h('button', { class: 'btn ghost small', onclick: addPage }, 'New page'));
  let editor;
  if (cur) {
    const title = h('input', { type: 'text', value: cur.title, 'aria-label': 'Page title' });
    title.addEventListener('input', () => { cur.title = title.value; touch(cur); });
    title.addEventListener('change', () => renderP());
    const body = h('textarea', { 'aria-label': 'Notes', placeholder: 'Write anything you want to remember.' });
    body.value = cur.body;
    body.addEventListener('input', () => { cur.body = body.value; touch(cur); });
    editor = h('div', { class: 'editor', onfocusout: () => renderSoon() }, title, body,
      h('div', { class: 'row', style: { justifyContent: 'space-between' } }, saveState,
        h('button', { class: 'btn ghost small danger', onclick: async () => {
          if (await ask('Delete this page?', `“${cur.title || 'Untitled'}” will be removed from all your devices.`, 'Delete page', true)) {
            cur.deleted = true; cur.body = ''; touch(cur); P.page = null; renderP();
          }
        } }, 'Delete page')));
  } else editor = h('div', { class: 'editor' }, h('p', { class: 'empty' }, 'Your notes save on this device and back up to the GM’s console, so they follow your character between sessions.'), h('div', null, h('button', { class: 'btn primary', onclick: addPage }, 'Start a page')));
  return h('section', { class: 'v-sec' }, h('h2', null, 'Notes'), h('div', { class: 'notes' }, list, editor));
}

function renderP() {
  if (!P.view) return renderWaiting(P.statusText);
  const v = P.view;
  const seen = new Set(P.seen.msgs || []);
  const unread = (v.messages || []).filter((m) => !seen.has(m.id)).length;
  const me = (v.roster || []).find((r) => r.id === v.me);
  const menu = P.role === 'player' ? h('button', { class: 'btn ghost icon-btn', title: 'Options', 'aria-label': 'Options', onclick: () => {
    modal((box, close) => box.append(h('h3', null, me ? `Playing ${me.name}` : 'Options'),
      h('div', { class: 'stack' },
        h('button', { class: 'btn', onclick: () => { close(); LS.del(pKey('who')); P.who = null; P.view = null; pickScreen(); send({ t: 'leave' }); } }, 'Switch character'),
        h('button', { class: 'btn', onclick: () => { close(); leaveRoom(); } }, 'Leave this room'),
        h('button', { class: 'btn ghost', onclick: () => close() }, 'Close'))));
  } }, '⋯') : null;
  const a = document.activeElement;
  const typingNotes = P.tab === 'notes' && a && a.matches && a.matches('.notes input, .notes textarea');
  const scroll = window.scrollY;
  const screen = viewerScreen(v, {
    mode: P.role, tab: P.tab, status: P.status, statusText: P.statusText, unread, seen: P.seen, menu,
    fearPulseFrom: P.fearPulseFrom,
    onTab: (k) => {
      P.tab = k;
      if (k === 'inbox') { P.seen.msgs = (v.messages || []).map((m) => m.id); saveSeen(); }
      renderP(); window.scrollTo(0, 0);
    },
    notesPanel, onOpenHandout: (ho) => handoutOverlay(ho),
  });
  P.fearPulseFrom = null;
  if (typingNotes) {
    // Keep the notebook untouched while someone is typing; refresh only the header and tabs.
    const cur = appRoot();
    for (const sel of ['.v-head', '.tabs']) { const o = cur.querySelector(sel), n = screen.querySelector(sel); if (o && n) o.replaceWith(n); }
    return;
  }
  appRoot().replaceChildren(screen);
  window.scrollTo(0, scroll);
}


/* ============================================================
   GM console. Holds the only copy of campaign state, filters it
   per viewer, and sends each player only what they may see.
   ============================================================ */
const G = {
  S: null, notes: {}, peer: null, clients: new Map(), section: 'clocks',
  status: 'wait', statusText: 'Opening the room', idTries: 0,
  selChip: null, previewWho: null, previewTab: 'board', lastDragSend: 0,
};
const activeRoster = () => G.S.roster.filter((r) => r.active);

async function startGM() {
  await AssetStore.all();
  G.S = migrateState(LS.get('hdoc.gm.state', null) || defaultState());
  G.notes = LS.get('hdoc.gm.notes', {});
  normalizeGroups();
  saveGM();
  applyTheme(G.S.theme);
  document.title = 'GM — ' + (G.S.title || APP.name);
  renderGM();
  hostPeer();
  // Heartbeat: keeps phones' connections honest and clears out devices that have gone away.
  setInterval(() => {
    const now = Date.now();
    for (const [id, c] of G.clients) {
      if (now - (c.lastSeen || now) > 16000) { try { c.conn.close(); } catch {} G.clients.delete(id); renderConns(); continue; }
      safeSend(c.conn, { t: 'ping' });
    }
  }, 4000);
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    if (document.querySelector('.modal-back')) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); setFear(G.S.fear.value + 1); }
    else if (e.key === '-' || e.key === '_') { e.preventDefault(); setFear(G.S.fear.value - 1); }
  });
}
function saveGM() { LS.set('hdoc.gm.state', G.S); }
const broadcastSoon = debounce(broadcast, 50);
function commit(opts = {}) {
  saveGM();
  broadcastSoon();
  if (opts.render === false) refreshPreview(); else renderGM();
}

/* ---------- networking ---------- */
function setGMStatus(st, text) {
  G.status = st; G.statusText = text;
  const el = $('#gm-status');
  if (el) { el.className = 'status ' + st; el.lastChild.textContent = text; }
}
function hostPeer() {
  try { if (G.peer) G.peer.destroy(); } catch {}
  setGMStatus('wait', 'Opening the room');
  const peer = new Peer(PEER_PREFIX + G.S.room, peerOptions());
  G.peer = peer;
  peer.on('open', () => { G.idTries = 0; setGMStatus('live', 'Room open'); });
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      G.clients.set(conn.connectionId, { conn, who: null, last: null, lastSeen: Date.now() });
      safeSend(conn, helloMsg());
      renderConns();
    });
    conn.on('data', (d) => onClientData(conn, d));
    const gone = () => { G.clients.delete(conn.connectionId); renderConns(); };
    conn.on('close', gone);
    conn.on('error', gone);
  });
  peer.on('disconnected', () => {
    if (peer !== G.peer || peer.destroyed) return;
    setGMStatus('wait', 'Reconnecting');
    setTimeout(() => { try { if (peer === G.peer && !peer.destroyed) peer.reconnect(); } catch {} }, 1500);
  });
  peer.on('error', (e) => {
    if (peer !== G.peer) return;
    if (e.type === 'unavailable-id') {
      G.idTries++;
      setGMStatus('wait', 'This room is open in another tab or window');
      if (G.idTries < 8) setTimeout(() => { if (peer === G.peer) hostPeer(); }, 4000);
    } else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(e.type)) {
      setGMStatus('wait', 'Reconnecting');
      setTimeout(() => { if (peer === G.peer) hostPeer(); }, 3000);
    } else console.warn('peer error', e.type, e);
  });
}
function helloMsg() { return { t: 'hello', title: G.S.title, roster: activeRoster().map((r) => ({ id: r.id, name: r.name, color: r.color, asset: r.asset })) }; }
function safeSend(conn, msg) { try { if (conn.open) conn.send(msg); } catch (e) { console.warn(e); } }

function onClientData(conn, msg) {
  const c = G.clients.get(conn.connectionId);
  if (!c || !msg || typeof msg !== 'object') return;
  c.lastSeen = Date.now();
  if (msg.t === 'pong') return;
  if (msg.t === 'hi') { safeSend(conn, helloMsg()); return; }
  if (msg.t === 'join') {
    if (msg.who === 'table') c.who = 'table';
    else if (typeof msg.who === 'string' && msg.who.startsWith('char:')) {
      const id = msg.who.slice(5);
      if (!activeRoster().some((r) => r.id === id)) { safeSend(conn, { t: 'kicked' }); return; }
      c.who = msg.who;
      if (G.notes[id]) safeSend(conn, { t: 'notes', notebook: G.notes[id] });
    } else return;
    sendView(c, true);
    renderConns();
  } else if (msg.t === 'leave') {
    c.who = null; renderConns();
  } else if (msg.t === 'need' && Array.isArray(msg.ids)) {
    const allowed = c.who ? collectAssetIds(deriveView(c.who)) : collectAssetIds({ roster: activeRoster() });
    for (const id of msg.ids.slice(0, 300)) {
      const a = AssetStore.mem.get(id);
      if (a && allowed.has(id)) safeSend(conn, { t: 'asset', asset: a });
    }
  } else if (msg.t === 'notes' && c.who && c.who.startsWith('char:') && msg.notebook && Array.isArray(msg.notebook.pages)) {
    const id = c.who.slice(5);
    const clean = { pages: msg.notebook.pages.slice(0, 300).filter((p) => p && typeof p.id === 'string').map((p) => ({
      id: p.id.slice(0, 40), title: String(p.title || '').slice(0, 200), body: String(p.body || '').slice(0, 200000),
      created: Number(p.created) || 0, at: Number(p.at) || 0, deleted: !!p.deleted })) };
    const merged = mergeNotebook(G.notes[id], clean);
    G.notes[id] = merged;
    LS.set('hdoc.gm.notes', G.notes);
    for (const o of G.clients.values()) if (o.who === c.who && o !== c) safeSend(o.conn, { t: 'notes', notebook: merged });
    safeSend(conn, { t: 'notes', notebook: merged });
    if (G.section === 'notes' && !typing()) renderGM();
  }
}

/* What a given viewer is allowed to see. Anything hidden never leaves this browser. */
function deriveView(who) {
  const S = G.S, m = S.modules;
  const isTable = who === 'table';
  const me = !isTable && who ? who.slice(5) : null;
  const roster = activeRoster().map((r) => ({ id: r.id, name: r.name, color: r.color, asset: r.asset, hope: m.hope ? r.hope : undefined }));
  const v = { title: S.title, subtitle: S.subtitle, theme: S.theme, roster, me, hope: !!m.hope };
  if (m.fear) v.fear = { value: S.fear.value, max: S.fear.max };
  if (m.clocks) v.clocks = S.clocks.filter((c) => c.visible !== false).map((c) => {
    const o = { id: c.id, name: c.name, type: c.type, style: c.style, size: c.size, value: c.value, color: c.color, asset: c.asset || null };
    if (c.type === 'tug') Object.assign(o, { floor: c.floor, lowLabel: c.lowLabel, highLabel: c.highLabel });
    return o;
  });
  if (m.party) v.groups = S.groups.map((g) => {
    const member = me && g.members.includes(me);
    return { id: g.id, name: g.name, members: g.members.filter((id) => roster.some((r) => r.id === id)),
      location: g.private && !member ? null : g.location, spotlight: S.spotlight === g.id, briefing: member ? (g.briefing || '') : '' };
  });
  if (m.map) {
    const mp = S.maps.find((x) => x.id === S.activeMap);
    if (mp) v.map = { name: mp.name, asset: mp.asset, grid: mp.grid, gridN: mp.gridN, tokens: (mp.tokens || []).filter((t) => !t.hidden).map((t) => ({ ...t })) };
  }
  if (m.handouts) {
    v.handouts = S.handouts.filter((ho) => ho.share && (ho.share.all || (me && ho.share.to.includes(me))))
      .filter((ho) => !isTable || ho.share.all)
      .map((ho) => ({ id: ho.id, title: ho.title, kind: ho.kind, asset: ho.asset || null, body: ho.body || '', at: ho.sharedAt || ho.at }));
    if (S.reveal && v.handouts.some((ho) => ho.id === S.reveal.id)) v.reveal = { id: S.reveal.id, at: S.reveal.at };
  }
  if (m.messages && me) v.messages = S.messages.filter((x) => x.to.includes(me)).map((x) => ({ id: x.id, text: x.text, at: x.at }));
  if (m.notes && me) v.notes = true;
  return v;
}
function sendView(c, force) {
  const v = deriveView(c.who);
  const js = JSON.stringify(v);
  if (!force && c.last === js) return;
  c.last = js;
  safeSend(c.conn, { t: 'view', view: v });
}
function broadcast() { for (const c of G.clients.values()) if (c.who) sendView(c); }

/* ---------- state helpers ---------- */
function normalizeGroups() {
  const S = G.S, active = activeRoster().map((r) => r.id);
  if (!S.groups.length) S.groups.push({ id: 'g' + uid(), name: 'The party', location: '', members: [], private: false, briefing: '' });
  const seen = new Set();
  for (const g of S.groups) g.members = g.members.filter((id) => active.includes(id) && !seen.has(id) && seen.add(id));
  for (const id of active) if (!seen.has(id)) S.groups[0].members.push(id);
  if (S.spotlight && !S.groups.some((g) => g.id === S.spotlight)) S.spotlight = null;
}
function setFear(n) { G.S.fear.value = clamp(n, 0, G.S.fear.max); commit(); }

        h('button', { class: 'btn small ghost danger', onclick: async () => { if (await ask(`Delete ${t.name}?`, 'Enemies already in the fight keep their stats.', 'Delete', true)) { A.library.splice(i, 1); commit(); } } }, 'Delete'))),
    h('details', null, h('summary', null, 'Stat block'), statBlockEl(t))));
  return h('div', null,
    h('div', { class: 'sec-head' }, h('h2', null, 'Adversaries'), h('span', { class: 'small-text muted' }, 'Only you see this. Nothing here is sent to players.')),
    h('h3', { style: { fontSize: '22px', margin: '18px 0 10px' } }, 'In the fight'),
    A.active.length ? h('div', { class: 'toolbar', style: { marginTop: 0 } },
      h('span', { class: 'small-text muted', style: { alignSelf: 'center' } }, `${A.active.length - defeated} standing, ${defeated} defeated`),
      h('button', { class: 'btn small', disabled: !defeated, onclick: () => { A.active = A.active.filter((e) => e.hpMarked < e.tpl.hp); commit(); } }, 'Clear defeated'),
      h('button', { class: 'btn small ghost danger', onclick: async () => { if (await ask('End the fight?', 'Every adversary is removed from the fight. Stat blocks stay in the library.', 'End fight', true)) { A.active = []; commit(); } } }, 'End fight')) : null,
    A.active.length ? h('div', { class: 'adv-grid' }, cards) : h('p', { class: 'empty' }, 'No one is fighting. Add adversaries from your stat blocks below.'),
    h('div', { class: 'row', style: { justifyContent: 'space-between', margin: '30px 0 10px' } },
      h('h3', { style: { fontSize: '22px' } }, 'Stat blocks'),
      h('button', { class: 'btn small', onclick: () => editAdversary(null) }, 'New stat block')),
    h('div', { class: 'stack' }, lib.length ? lib : h('p', { class: 'empty' }, 'No stat blocks yet.')));
}
async function editAdversary(orig) {
  const A = G.S.adversaries;
  const t = orig ? clone(orig) : blankAdversary();
  const num = (k, label, w = '80px') => { const i = h('input', { type: 'number', value: t[k], style: { width: w } }); i.addEventListener('input', () => { t[k] = Number(i.value); }); return h('label', { class: 'field' }, h('span', null, label), i); };
  const txt = (k, label, area) => {
    const i = area ? h('textarea', { style: { minHeight: '64px' } }) : h('input', { type: 'text' });
    i.value = t[k] || ''; i.addEventListener('input', () => { t[k] = i.value; });
    return h('label', { class: 'field' }, h('span', null, label), i);
  };
  const sel = (k, label, opts) => h('label', { class: 'field' }, h('span', null, label),
    h('select', { onchange: (e) => { t[k] = e.target.value; } }, opts.map((o) => h('option', { value: o, selected: String(t[k]) === String(o) }, o))));
  const ok = await modal((box, close) => {
    box.style.width = 'min(760px, 100%)';
    const feats = h('div', { class: 'stack' });
    const drawFeats = () => feats.replaceChildren(...t.features.map((f, i) => {
      const name = h('input', { type: 'text', value: f.name, placeholder: 'Feature name' }); name.addEventListener('input', () => { f.name = name.value; });
      const kind = h('select', { onchange: (e) => { f.kind = e.target.value; } }, ['Passive', 'Action', 'Reaction'].map((k) => h('option', { value: k, selected: f.kind === k }, k)));
      const fear = h('input', { type: 'number', min: '0', value: f.fear || 0, style: { width: '64px' }, title: 'Fear cost' }); fear.addEventListener('input', () => { f.fear = Number(fear.value) || 0; });
      const text = h('textarea', { style: { minHeight: '60px' }, placeholder: 'What it does' }); text.value = f.text || ''; text.addEventListener('input', () => { f.text = text.value; });
      return h('div', { class: 'panel stack', style: { padding: '10px' } },
        h('div', { class: 'row' }, name, kind, h('label', { class: 'row', style: { gap: '6px' } }, h('span', { class: 'ctl-label' }, 'Fear cost'), fear),
          h('button', { class: 'btn small ghost danger', onclick: () => { t.features.splice(i, 1); drawFeats(); } }, 'Remove')), text);
    }));
    drawFeats();
    box.append(h('h3', null, orig ? `Edit ${orig.name}` : 'New stat block'),
      h('div', { class: 'stack' },
        txt('name', 'Name'),
        h('div', { class: 'row' }, sel('tier', 'Tier', [1, 2, 3, 4]), sel('type', 'Type', ADV_TYPES), num('difficulty', 'Difficulty'), num('major', 'Major threshold'), num('severe', 'Severe threshold'), num('hp', 'HP'), num('stress', 'Stress')),
        h('div', { class: 'row' }, num('atk', 'ATK modifier'), txt('attackName', 'Attack name'), sel('range', 'Range', ADV_RANGES), txt('damage', 'Damage')),
        txt('experiences', 'Experiences'),
        txt('description', 'Description', true), txt('motives', 'Motives and tactics', true),
        h('div', { class: 'row', style: { justifyContent: 'space-between' } }, h('h3', { style: { fontSize: '20px', margin: 0 } }, 'Features'),
          h('button', { class: 'btn small', onclick: () => { t.features.push({ name: '', kind: 'Action', fear: 0, text: '' }); drawFeats(); } }, 'Add feature')),
        feats),
      h('div', { class: 'row end' }, h('button', { class: 'btn ghost', onclick: () => close(false) }, 'Cancel'), h('button', { class: 'btn primary', onclick: () => close(true) }, 'Save stat block')));
  });
  if (!ok) return;
  t.hp = clamp(Math.round(t.hp) || 1, 1, 40); t.stress = clamp(Math.round(t.stress) || 0, 0, 20);
  t.tier = Number(t.tier) || 1;
  if (orig) {
    Object.assign(orig, t);
    for (const e of A.active) if (e.tpl.id === orig.id) { e.tpl = clone(orig); e.hpMarked = Math.min(e.hpMarked, e.tpl.hp); e.stressMarked = Math.min(e.stressMarked, e.tpl.stress); }
  } else A.library.push(t);
  commit();
}


/* ============================================================
   Boot: #gm opens the console, #table the table display,
   anything else the player view.
   ============================================================ */
(function boot() {
  const hash = location.hash.replace('#', '').toLowerCase();
  if (typeof Peer === 'undefined') {
    appRoot().replaceChildren(h('div', { class: 'join' }, h('h1', null, 'Couldn’t start'), h('p', { class: 'hint' }, 'The connection library failed to load. Reload the page.')));
    return;
  }
  window.addEventListener('hashchange', () => location.reload());
  if (hash === 'gm') startGM();
  else startViewer(hash === 'table' ? 'table' : 'player');
})();

</script>
